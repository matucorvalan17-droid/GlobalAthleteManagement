<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATE.CORVA — Instagram Content System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #070707;
    --dark-green: #0a1a0f;
    --gold: #c9a84c;
    --gold-dim: #a07830;
    --white: #ffffff;
    --gray: #8a8a8a;
    --light-gray: #c0c0c0;
    --sidebar-bg: #0d0d0d;
    --border: #1e1e1e;
    --slide-w: 540px;
    --slide-h: 675px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--white);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid var(--border);
  }

  .brand-logo {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .sidebar-title {
    font-size: 13px;
    color: var(--gray);
    letter-spacing: 1px;
  }

  .day-list {
    overflow-y: auto;
    flex: 1;
    padding: 8px 0;
  }

  .day-list::-webkit-scrollbar { width: 3px; }
  .day-list::-webkit-scrollbar-track { background: transparent; }
  .day-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .day-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 2px solid transparent;
  }

  .day-item:hover { background: rgba(255,255,255,0.03); }

  .day-item.active {
    background: rgba(201,168,76,0.06);
    border-left-color: var(--gold);
  }

  .day-num {
    font-size: 11px;
    color: var(--gray);
    width: 24px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }

  .day-item.active .day-num { color: var(--gold); }

  .day-info { flex: 1; min-width: 0; }

  .day-topic {
    font-size: 11px;
    font-weight: 600;
    color: var(--light-gray);
    letter-spacing: 0.3px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .day-item.active .day-topic { color: var(--white); }

  .cat-tag {
    display: inline-block;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 2px;
    margin-top: 3px;
  }

  .cat-scouting  { background: rgba(201,168,76,0.15); color: var(--gold); }
  .cat-tactics   { background: rgba(56,132,255,0.15); color: #5896ff; }
  .cat-news      { background: rgba(255,90,90,0.15);  color: #ff6b6b; }
  .cat-business  { background: rgba(160,120,48,0.12); color: #c8943a; }
  .cat-facts     { background: rgba(80,200,120,0.12); color: #5cc87a; }
  .cat-data      { background: rgba(140,80,255,0.15); color: #a870ff; }
  .cat-mentality { background: rgba(255,180,50,0.12); color: #ffb832; }
  .cat-development { background: rgba(50,180,200,0.12); color: #32c8c8; }

  /* ── MAIN AREA ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  .carousel-header {
    padding: 20px 32px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }

  .header-left { flex: 1; }

  .header-day {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--gray);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .header-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 0.5px;
    line-height: 1.3;
  }

  .header-cat { margin-top: 6px; }

  /* ── SLIDE AREA ── */
  .slide-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 20px;
  }

  .slide-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* The actual slide at 540×675 (50% of 1080×1350) */
  .slide-viewport {
    width: var(--slide-w);
    height: var(--slide-h);
    position: relative;
    overflow: hidden;
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  }

  /* ── SLIDE CONTROLS ── */
  .slide-controls {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .nav-btn {
    width: 36px;
    height: 36px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--white);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
  }

  .nav-btn:hover { border-color: var(--gold); color: var(--gold); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-btn:disabled:hover { border-color: var(--border); color: var(--white); }

  .dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border);
    cursor: pointer;
    transition: all 0.15s;
  }

  .dot.active { background: var(--gold); width: 18px; border-radius: 3px; }

  /* ── EXPORT BAR ── */
  .export-bar {
    padding: 14px 32px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .slide-counter {
    font-size: 11px;
    color: var(--gray);
    letter-spacing: 2px;
  }

  .export-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--gold);
    color: #000;
    border: none;
    padding: 9px 20px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.15s;
  }

  .export-btn:hover { background: #e0b95a; }
  .export-btn.loading { opacity: 0.6; cursor: wait; }

  .export-all-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 9px 20px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    margin-right: 10px;
  }

  .export-all-btn:hover { background: rgba(201,168,76,0.1); }

  /* ── VIEW TOGGLE ── */
  .view-toggle {
    display: flex;
    gap: 4px;
    margin-left: auto;
    margin-right: 16px;
  }

  .toggle-btn {
    width: 32px;
    height: 32px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--gray);
    border-radius: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
  }

  .toggle-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.06); }
  .toggle-btn:hover { border-color: rgba(201,168,76,0.5); color: var(--light-gray); }

  /* ── GRID VIEW ── */
  .grid-area {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px;
    display: none;
  }

  .grid-area.visible { display: block; }
  .slide-area.hidden { display: none; }

  .grid-area::-webkit-scrollbar { width: 4px; }
  .grid-area::-webkit-scrollbar-track { background: transparent; }
  .grid-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .grid-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--gray);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .slides-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .grid-slide-item {
    cursor: pointer;
    border-radius: 4px;
    overflow: hidden;
    border: 2px solid transparent;
    transition: border-color 0.15s, transform 0.15s;
    position: relative;
  }

  .grid-slide-item:hover { border-color: rgba(201,168,76,0.4); transform: translateY(-2px); }
  .grid-slide-item.active-grid { border-color: var(--gold); }

  .grid-slide-inner {
    width: 100%;
    aspect-ratio: 4/5;
    overflow: hidden;
    position: relative;
  }

  .grid-slide-inner .slide {
    width: 540px;
    height: 675px;
    transform-origin: top left;
    position: absolute;
    top: 0;
    left: 0;
  }

  .grid-slide-num {
    position: absolute;
    bottom: 6px;
    right: 8px;
    font-size: 9px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.4);
    z-index: 20;
  }

  /* ── EXPORT BAR ── */
     SLIDE TEMPLATES (rendered at 540×675)
     Full res = 1080×1350 (scale 2x on export)
  ═══════════════════════════════════════ */

  .slide {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  /* Grain overlay */
  .slide::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 10;
    opacity: 0.5;
    mix-blend-mode: overlay;
  }

  /* ── COVER SLIDE ── */
  .slide-cover {
    background: #070707;
  }

  .slide-cover .bg-spotlight {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 40%, rgba(20,50,20,0.7) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 20% 80%, rgba(201,168,76,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 100% 60% at 50% 100%, rgba(10,26,15,0.8) 0%, transparent 80%);
  }

  .slide-cover .handle {
    position: absolute;
    top: 28px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 9px;
    letter-spacing: 4px;
    color: rgba(201,168,76,0.7);
    text-transform: uppercase;
    font-weight: 600;
    z-index: 5;
  }

  .slide-cover .cover-content {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    transform: translateY(-54%);
    padding: 0 40px;
    z-index: 5;
    text-align: center;
  }

  .slide-cover .cover-label {
    font-size: 9px;
    letter-spacing: 5px;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 20px;
    opacity: 0.8;
  }

  .slide-cover .cover-title {
    font-size: 36px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.5px;
    text-transform: uppercase;
    color: var(--white);
    margin-bottom: 12px;
  }

  .slide-cover .cover-keyword {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-size: 42px;
    color: var(--gold);
    line-height: 1;
    display: block;
    margin-bottom: 18px;
  }

  .slide-cover .cover-subtitle {
    font-size: 11px;
    color: var(--gray);
    letter-spacing: 1px;
    line-height: 1.6;
    max-width: 320px;
    margin: 0 auto;
  }

  .slide-cover .swipe-hint {
    position: absolute;
    bottom: 28px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 9px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    z-index: 5;
  }

  .slide-cover .cover-line {
    width: 30px;
    height: 1px;
    background: var(--gold);
    margin: 0 auto 16px;
    opacity: 0.6;
  }

  /* ── INSIGHT SLIDE ── */
  .slide-insight {
    background: #070707;
  }

  .slide-insight .bg-spotlight {
    position: absolute;
    inset: 0;
  }

  .slide-insight.variant-a .bg-spotlight {
    background:
      radial-gradient(ellipse 70% 60% at 80% 30%, rgba(10,26,15,0.9) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 10% 70%, rgba(201,168,76,0.04) 0%, transparent 60%);
  }

  .slide-insight.variant-b .bg-spotlight {
    background:
      radial-gradient(ellipse 80% 50% at 20% 20%, rgba(15,30,20,0.8) 0%, transparent 70%),
      radial-gradient(ellipse 60% 50% at 90% 90%, rgba(5,15,10,0.6) 0%, transparent 60%);
  }

  .slide-insight.variant-c .bg-spotlight {
    background:
      radial-gradient(ellipse 100% 40% at 50% 0%, rgba(201,168,76,0.05) 0%, transparent 60%),
      radial-gradient(ellipse 60% 60% at 50% 100%, rgba(10,26,15,0.8) 0%, transparent 70%);
  }

  .slide-insight.variant-d .bg-spotlight {
    background:
      radial-gradient(ellipse 60% 60% at 0% 50%, rgba(10,26,15,0.7) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 100% 20%, rgba(201,168,76,0.04) 0%, transparent 60%);
  }

  .slide-insight.variant-e .bg-spotlight {
    background:
      radial-gradient(ellipse 80% 80% at 50% 50%, rgba(8,22,12,0.9) 0%, transparent 80%),
      radial-gradient(ellipse 30% 30% at 80% 80%, rgba(201,168,76,0.05) 0%, transparent 50%);
  }

  .slide-insight .counter {
    position: absolute;
    top: 28px;
    left: 36px;
    font-size: 9px;
    letter-spacing: 4px;
    color: rgba(201,168,76,0.5);
    font-weight: 700;
    z-index: 5;
  }

  .slide-insight .handle {
    position: absolute;
    top: 28px;
    right: 36px;
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.2);
    z-index: 5;
  }

  .slide-insight .insight-content {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 72px 36px 56px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 5;
  }

  .slide-insight .insight-keyword {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-size: 48px;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 16px;
    display: block;
  }

  .slide-insight .insight-title {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--white);
    line-height: 1.2;
    margin-bottom: 18px;
  }

  .slide-insight .divider {
    width: 24px;
    height: 1px;
    background: var(--gold);
    margin-bottom: 18px;
    opacity: 0.5;
  }

  .slide-insight .insight-body {
    font-size: 13px;
    color: var(--light-gray);
    line-height: 1.7;
    letter-spacing: 0.2px;
    font-weight: 300;
  }

  .slide-insight .bottom-handle {
    position: absolute;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 8px;
    letter-spacing: 3px;
    color: rgba(201,168,76,0.35);
    font-weight: 700;
    text-transform: uppercase;
    z-index: 5;
  }

  /* ── CTA SLIDE ── */
  .slide-cta {
    background: #070707;
  }

  .slide-cta .bg-spotlight {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 50%, rgba(201,168,76,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 60% 80% at 50% 100%, rgba(10,26,15,0.9) 0%, transparent 70%);
  }

  .slide-cta .handle {
    position: absolute;
    top: 28px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 9px;
    letter-spacing: 4px;
    color: rgba(201,168,76,0.6);
    text-transform: uppercase;
    font-weight: 700;
    z-index: 5;
  }

  .slide-cta .cta-content {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 0 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 5;
  }

  .slide-cta .cta-line {
    width: 20px;
    height: 1px;
    background: var(--gold);
    margin-bottom: 24px;
    opacity: 0.6;
  }

  .slide-cta .cta-main {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--white);
    line-height: 1.15;
    margin-bottom: 14px;
  }

  .slide-cta .cta-keyword {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    color: var(--gold);
  }

  .slide-cta .cta-question {
    font-size: 12px;
    color: var(--gray);
    line-height: 1.6;
    letter-spacing: 0.3px;
    font-style: italic;
    margin-top: 20px;
    max-width: 300px;
  }

  .slide-cta .cta-follow {
    position: absolute;
    bottom: 28px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 5;
  }

  .slide-cta .follow-text {
    font-size: 8px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.2);
    text-transform: uppercase;
    display: block;
    margin-bottom: 4px;
  }

  .slide-cta .follow-handle {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--gold);
    font-weight: 700;
  }

  /* ── EXPORT OVERLAY (full res 1080×1350) ── */
  #export-canvas-wrapper {
    position: fixed;
    top: -9999px;
    left: -9999px;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    z-index: -1;
  }

  #export-slide {
    width: 1080px;
    height: 1350px;
    transform-origin: top left;
  }

  #export-slide .slide-cover .cover-title { font-size: 72px; }
  #export-slide .slide-cover .cover-keyword { font-size: 84px; }
  #export-slide .slide-cover .cover-subtitle { font-size: 22px; max-width: 640px; }
  #export-slide .slide-cover .cover-label { font-size: 18px; }
  #export-slide .slide-cover .handle { font-size: 18px; top: 56px; }
  #export-slide .slide-cover .swipe-hint { font-size: 18px; bottom: 56px; letter-spacing: 8px; }
  #export-slide .slide-cover .cover-content { padding: 0 80px; }
  #export-slide .slide-cover .cover-line { width: 60px; margin-bottom: 32px; }

  #export-slide .slide-insight .counter { font-size: 18px; top: 56px; left: 72px; }
  #export-slide .slide-insight .handle { font-size: 18px; top: 56px; right: 72px; }
  #export-slide .slide-insight .insight-content { padding: 144px 72px 112px; }
  #export-slide .slide-insight .insight-keyword { font-size: 96px; margin-bottom: 32px; }
  #export-slide .slide-insight .insight-title { font-size: 32px; letter-spacing: 3px; margin-bottom: 36px; }
  #export-slide .slide-insight .divider { width: 48px; margin-bottom: 36px; }
  #export-slide .slide-insight .insight-body { font-size: 26px; line-height: 1.8; }
  #export-slide .slide-insight .bottom-handle { font-size: 16px; bottom: 48px; letter-spacing: 6px; }

  #export-slide .slide-cta .handle { font-size: 18px; top: 56px; }
  #export-slide .slide-cta .cta-content { padding: 0 80px; }
  #export-slide .slide-cta .cta-line { width: 40px; margin-bottom: 48px; }
  #export-slide .slide-cta .cta-main { font-size: 44px; line-height: 1.15; margin-bottom: 28px; }
  #export-slide .slide-cta .cta-question { font-size: 24px; max-width: 600px; margin-top: 40px; }
  #export-slide .slide-cta .follow-text { font-size: 16px; margin-bottom: 8px; }
  #export-slide .slide-cta .follow-handle { font-size: 22px; }
  #export-slide .slide-cta .cta-follow { bottom: 56px; }
</style>
</head>
<body>

<!-- ── SIDEBAR ── -->
<div class="sidebar">
  <div class="sidebar-header">
    <div class="brand-logo">@mateo.corva</div>
    <div class="sidebar-title">Content System · 10 Carousels</div>
  </div>
  <div class="day-list" id="dayList"></div>
</div>

let currentDay = 0;
let currentSlide = 0;

// ═══════════════════════════════════════════════════════════════
// CATEGORY CONFIG
// ═══════════════════════════════════════════════════════════════
const CAT_CLASS = {
  Scouting: 'cat-scouting',
  Tactics: 'cat-tactics',
  News: 'cat-news',
  Business: 'cat-business',
  Facts: 'cat-facts',
  Data: 'cat-data',
  Mentality: 'cat-mentality',
  Development: 'cat-development'
};

// ═══════════════════════════════════════════════════════════════
// RENDER SIDEBAR
// ═══════════════════════════════════════════════════════════════
function renderSidebar() {
  const list = document.getElementById('dayList');
  list.innerHTML = CAROUSELS.map((c, i) => `
    <div class="day-item ${i === currentDay ? 'active' : ''}" onclick="loadDay(${i})">
      <span class="day-num">${String(c.day).padStart(2,'0')}</span>
      <div class="day-info">
        <div class="day-topic">${c.topic}</div>
        <span class="cat-tag ${CAT_CLASS[c.category]}">${c.category}</span>
      </div>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════════════════════════
// RENDER SLIDE
// ═══════════════════════════════════════════════════════════════
function renderSlide(carousel, slideIndex, targetEl) {
  const slide = carousel.slides[slideIndex];
  let html = '';

  if (slide.type === 'cover') {
    html = `
      <div class="slide slide-cover">
        <div class="bg-spotlight"></div>
        <div class="handle">@mateo.corva</div>
        <div class="cover-content">
          <div class="cover-label">${slide.label}</div>
          <div class="cover-line"></div>
          <div class="cover-title">${slide.titleLines.join('<br>')}</div>
          <span class="cover-keyword">${slide.keyword}</span>
          <div class="cover-subtitle">${slide.subtitle}</div>
        </div>
        <div class="swipe-hint">Swipe &rarr;</div>
      </div>
    `;
  } else if (slide.type === 'insight') {
    html = `
      <div class="slide slide-insight variant-${slide.variant}">
        <div class="bg-spotlight"></div>
        <div class="counter">${slide.counter}</div>
        <div class="handle">@mateo.corva</div>
        <div class="insight-content">
          <span class="insight-keyword">${slide.keyword}</span>
          <div class="insight-title">${slide.title}</div>
          <div class="divider"></div>
          <div class="insight-body">${slide.body}</div>
        </div>
        <div class="bottom-handle">@mateo.corva</div>
      </div>
    `;
  } else if (slide.type === 'cta') {
    const mainLines = slide.main.map((line, i) =>
      i === slide.keyword_index
        ? `<span class="cta-keyword">${line}</span>`
        : line
    ).join('<br>');
    html = `
      <div class="slide slide-cta">
        <div class="bg-spotlight"></div>
        <div class="handle">@mateo.corva</div>
        <div class="cta-content">
          <div class="cta-line"></div>
          <div class="cta-main">${mainLines}</div>
          <div class="cta-question">${slide.question}</div>
        </div>
        <div class="cta-follow">
          <span class="follow-text">Follow for more</span>
          <span class="follow-handle">@mateo.corva</span>
        </div>
      </div>
    `;
  }

  targetEl.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════
// UPDATE UI
// ═══════════════════════════════════════════════════════════════
function updateUI() {
  const carousel = CAROUSELS[currentDay];
  const totalSlides = carousel.slides.length;

  // Header
  document.getElementById('headerDay').textContent = `DAY ${carousel.day}`;
  document.getElementById('headerTitle').textContent = carousel.topic;
  document.getElementById('headerCat').innerHTML =
    `<span class="cat-tag ${CAT_CLASS[carousel.category]}">${carousel.category}</span>`;

  // Slide
  const viewport = document.getElementById('slideViewport');
  renderSlide(carousel, currentSlide, viewport);

  // Counter
  document.getElementById('slideCounter').textContent =
    `SLIDE ${String(currentSlide + 1).padStart(2,'0')} / ${String(totalSlides).padStart(2,'0')}`;

  // Dots
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = carousel.slides.map((_, i) =>
    `<div class="dot ${i === currentSlide ? 'active' : ''}" onclick="goSlide(${i})"></div>`
  ).join('');

  // Nav buttons
  document.getElementById('btnPrev').disabled = currentSlide === 0;
  document.getElementById('btnNext').disabled = currentSlide === totalSlides - 1;

  // Sidebar highlight
  renderSidebar();
}

function loadDay(dayIndex) {
  currentDay = dayIndex;
  currentSlide = 0;
  updateUI();
}

function goSlide(index) {
  currentSlide = index;
  updateUI();
}

// ═══════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════
document.getElementById('btnPrev').addEventListener('click', () => {
  if (currentSlide > 0) { currentSlide--; updateUI(); }
});

document.getElementById('btnNext').addEventListener('click', () => {
  const total = CAROUSELS[currentDay].slides.length;
  if (currentSlide < total - 1) { currentSlide++; updateUI(); }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' && currentSlide > 0) { currentSlide--; updateUI(); }
  if (e.key === 'ArrowRight') {
    const total = CAROUSELS[currentDay].slides.length;
    if (currentSlide < total - 1) { currentSlide++; updateUI(); }
  }
  if (e.key === 'ArrowUp' && currentDay > 0) { loadDay(currentDay - 1); }
  if (e.key === 'ArrowDown' && currentDay < CAROUSELS.length - 1) { loadDay(currentDay + 1); }
});

// ═══════════════════════════════════════════════════════════════
// PNG EXPORT
// ═══════════════════════════════════════════════════════════════
async function exportCurrentSlide() {
  const btn = document.getElementById('exportBtn');
  btn.classList.add('loading');
  btn.textContent = 'Rendering...';

  const carousel = CAROUSELS[currentDay];
  const exportEl = document.getElementById('export-slide');
  exportEl.style.cssText = `width:1080px;height:1350px;position:relative;overflow:hidden;`;

  renderSlide(carousel, currentSlide, exportEl);

  // Wait for fonts
  await document.fonts.ready;
  await new Promise(r => setTimeout(r, 150));

  try {
    const canvas = await html2canvas(exportEl, {
      width: 1080,
      height: 1350,
      scale: 1,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#070707',
      logging: false
    });

    const link = document.createElement('a');
    link.download = `mateo-corva-day${carousel.day}-slide${currentSlide + 1}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (err) {
    console.error('Export failed:', err);
    alert('Export failed. Check console for details.');
  }

  exportEl.innerHTML = '';
  btn.classList.remove('loading');
  btn.innerHTML = '&#8595; Export PNG';
}

async function exportAllSlides() {
  const btn = document.getElementById('exportAllBtn');
  btn.textContent = 'Exporting...';
  btn.disabled = true;

  const carousel = CAROUSELS[currentDay];
  const exportEl = document.getElementById('export-slide');
  exportEl.style.cssText = `width:1080px;height:1350px;position:relative;overflow:hidden;`;

  await document.fonts.ready;

  for (let i = 0; i < carousel.slides.length; i++) {
    btn.textContent = `Exporting ${i + 1}/${carousel.slides.length}...`;
    renderSlide(carousel, i, exportEl);
    await new Promise(r => setTimeout(r, 200));

    try {
      const canvas = await html2canvas(exportEl, {
        width: 1080,
        height: 1350,
        scale: 1,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#070707',
        logging: false
      });

      const link = document.createElement('a');
      link.download = `mateo-corva-day${carousel.day}-slide${i + 1}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      await new Promise(r => setTimeout(r, 300));
    } catch (err) {
      console.error(`Slide ${i + 1} export failed:`, err);
    }
  }

  exportEl.innerHTML = '';
  btn.textContent = '&#8595; Export All Slides';
  btn.innerHTML = '&#8595; Export All Slides';
  btn.disabled = false;
}

// ═══════════════════════════════════════════════════════════════
// VIEW TOGGLE
// ═══════════════════════════════════════════════════════════════
let currentView = 'single';

function setView(mode) {
  currentView = mode;
  const slideArea = document.getElementById('slideArea');
  const gridArea = document.getElementById('gridArea');
  const btnSingle = document.getElementById('btnSingle');
  const btnGrid = document.getElementById('btnGrid');

  if (mode === 'grid') {
    slideArea.classList.add('hidden');
    gridArea.classList.add('visible');
    btnSingle.classList.remove('active');
    btnGrid.classList.add('active');
    renderGrid();
  } else {
    slideArea.classList.remove('hidden');
    gridArea.classList.remove('visible');
    btnSingle.classList.add('active');
    btnGrid.classList.remove('active');
    updateUI();
  }
}

function renderGrid() {
  const carousel = CAROUSELS[currentDay];
  const grid = document.getElementById('slidesGrid');
  const label = document.getElementById('gridLabel');
  label.textContent = `${carousel.slides.length} SLIDES — ${carousel.topic.toUpperCase()}`;

  grid.innerHTML = carousel.slides.map((_, i) => {
    const scaleNeeded = grid.offsetWidth / carousel.slides.length;
    return `
      <div class="grid-slide-item ${i === currentSlide ? 'active-grid' : ''}" onclick="selectGridSlide(${i})">
        <div class="grid-slide-inner" id="grid-inner-${i}"></div>
        <div class="grid-slide-num">0${i+1}</div>
      </div>
    `;
  }).join('');

  // Render each slide into its grid cell with correct scale
  carousel.slides.forEach((_, i) => {
    const inner = document.getElementById(`grid-inner-${i}`);
    const tempEl = document.createElement('div');
    renderSlide(carousel, i, tempEl);
    const slideEl = tempEl.firstElementChild;
    if (!slideEl) return;

    slideEl.style.width = '540px';
    slideEl.style.height = '675px';
    slideEl.style.position = 'absolute';
    slideEl.style.top = '0';
    slideEl.style.left = '0';

    inner.appendChild(slideEl);

    // Scale to fill the container
    const containerW = inner.offsetWidth || 200;
    const scale = containerW / 540;
    slideEl.style.transform = `scale(${scale})`;
    slideEl.style.transformOrigin = 'top left';
    inner.style.height = `${675 * scale}px`;
  });
}

function selectGridSlide(index) {
  currentSlide = index;
  // Update active highlight in grid
  document.querySelectorAll('.grid-slide-item').forEach((el, i) => {
    el.classList.toggle('active-grid', i === index);
  });
  document.getElementById('slideCounter').textContent =
    `SLIDE ${String(index + 1).padStart(2,'0')} / ${String(CAROUSELS[currentDay].slides.length).padStart(2,'0')}`;
}

// Re-render grid on resize
window.addEventListener('resize', () => {
  if (currentView === 'grid') renderGrid();
});

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
loadDay(0);
</script>
</body>
</html>
