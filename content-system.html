<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATE.CORVA — Content System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --bg: #070707;
  --gold: #c9a84c;
  --white: #ffffff;
  --gray: #8a8a8a;
  --lgray: #c0c0c0;
  --sidebar: #0d0d0d;
  --border: #1e1e1e;
  --card-w: 216px;
  --card-h: 270px;
  --scale: 0.4; /* 216/540 */
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--white);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 22px 18px 14px;
  border-bottom: 1px solid var(--border);
}

.brand-logo {
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--gold);
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 3px;
}

.sidebar-sub { font-size: 11px; color: var(--gray); letter-spacing: 0.5px; }

.day-list { overflow-y: auto; flex: 1; padding: 6px 0; }
.day-list::-webkit-scrollbar { width: 3px; }
.day-list::-webkit-scrollbar-thumb { background: var(--border); }

.day-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 18px;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background .12s;
}
.day-item:hover { background: rgba(255,255,255,.03); }
.day-item.active { background: rgba(201,168,76,.06); border-left-color: var(--gold); }

.day-num { font-size: 10px; color: var(--gray); width: 20px; font-weight: 700; }
.day-item.active .day-num { color: var(--gold); }

.day-info { flex: 1; min-width: 0; }
.day-topic {
  font-size: 11px; font-weight: 600; color: var(--lgray);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3;
}
.day-item.active .day-topic { color: var(--white); }

.cat-tag {
  display: inline-block; font-size: 7px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  padding: 2px 5px; border-radius: 2px; margin-top: 3px;
}
.cat-scouting   { background: rgba(201,168,76,.15); color: var(--gold); }
.cat-tactics    { background: rgba(56,132,255,.15);  color: #5896ff; }
.cat-news       { background: rgba(255,90,90,.15);   color: #ff6b6b; }
.cat-business   { background: rgba(160,120,48,.12);  color: #c8943a; }
.cat-facts      { background: rgba(80,200,120,.12);  color: #5cc87a; }
.cat-data       { background: rgba(140,80,255,.15);  color: #a870ff; }
.cat-mentality  { background: rgba(255,180,50,.12);  color: #ffb832; }
.cat-development{ background: rgba(50,180,200,.12);  color: #32c8c8; }

/* ── MAIN ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.top-bar {
  padding: 18px 28px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.top-bar-left {}
.top-day { font-size: 9px; letter-spacing: 3px; color: var(--gray); text-transform: uppercase; margin-bottom: 3px; }
.top-title { font-size: 15px; font-weight: 700; color: var(--white); line-height: 1.2; }
.top-meta { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
.slide-count-label { font-size: 9px; color: var(--gray); letter-spacing: 2px; }

.top-bar-right { display: flex; gap: 8px; align-items: center; }

.btn-export-all {
  background: var(--gold); color: #000; border: none;
  padding: 8px 16px; font-family: inherit; font-size: 10px;
  font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer; border-radius: 2px; transition: background .15s;
  white-space: nowrap;
}
.btn-export-all:hover { background: #e0b95a; }
.btn-export-all:disabled { opacity: .5; cursor: wait; }

/* ── SLIDES GRID ── */
.slides-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px 32px;
}
.slides-scroll::-webkit-scrollbar { width: 4px; }
.slides-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.slides-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr));
  gap: 20px;
}

/* ── SLIDE CARD ── */
.slide-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.card-preview {
  width: 100%;
  aspect-ratio: 4/5;
  position: relative;
  overflow: hidden;
  border-radius: 4px;
  border: 2px solid var(--border);
  cursor: pointer;
  transition: border-color .15s, transform .15s, box-shadow .15s;
  background: #070707;
}

.card-preview:hover {
  border-color: rgba(201,168,76,.5);
  transform: translateY(-3px);
  box-shadow: 0 12px 32px rgba(0,0,0,.6);
}

/* The scaled slide inside the card */
.card-preview .slide-inner-wrap {
  position: absolute;
  top: 0; left: 0;
  width: 540px;
  height: 675px;
  transform-origin: top left;
}

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2px;
}

.card-num {
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--gray);
  font-weight: 700;
}

.card-type {
  font-size: 8px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(201,168,76,.5);
}

.btn-card-export {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--gray);
  padding: 4px 10px;
  font-family: inherit;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 2px;
  transition: all .15s;
  white-space: nowrap;
}
.btn-card-export:hover { border-color: var(--gold); color: var(--gold); }

/* ── LIGHTBOX ── */
.lightbox {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.9);
  z-index: 100;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
}
.lightbox.open { display: flex; }

.lb-slide {
  width: 405px;
  height: 506px;
  position: relative;
  overflow: hidden;
  border-radius: 4px;
  box-shadow: 0 24px 80px rgba(0,0,0,.8);
  background: #070707;
}

.lb-slide .slide-inner-wrap {
  position: absolute; top: 0; left: 0;
  width: 540px; height: 675px;
  transform-origin: top left;
  transform: scale(0.75);
}

.lb-controls {
  display: flex;
  align-items: center;
  gap: 16px;
}

.lb-btn {
  width: 36px; height: 36px;
  border: 1px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.05);
  color: var(--white);
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  transition: all .15s;
}
.lb-btn:hover { border-color: var(--gold); color: var(--gold); }
.lb-btn:disabled { opacity: .3; cursor: default; }

.lb-counter { font-size: 11px; color: var(--gray); letter-spacing: 2px; min-width: 60px; text-align: center; }

.lb-close {
  position: absolute;
  top: 20px; right: 20px;
  width: 32px; height: 32px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.15);
  color: var(--white);
  border-radius: 50%;
  cursor: pointer;
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
  z-index: 10;
}
.lb-close:hover { background: rgba(255,255,255,.15); }

.lb-export {
  background: var(--gold); color: #000; border: none;
  padding: 8px 18px; font-family: inherit; font-size: 10px;
  font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer; border-radius: 2px; transition: background .15s;
}
.lb-export:hover { background: #e0b95a; }

/* ═══════════════════════════════
   SLIDE TEMPLATES (base 540×675)
═══════════════════════════════ */
.slide { width:100%; height:100%; position:relative; overflow:hidden; }

.slide::after {
  content:'';
  position:absolute; inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
  pointer-events:none; z-index:10; opacity:.5; mix-blend-mode:overlay;
}

/* COVER */
.slide-cover { background:#070707; }
.slide-cover .bg-spotlight {
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse 60% 50% at 50% 40%, rgba(20,50,20,.7) 0%, transparent 70%),
    radial-gradient(ellipse 40% 30% at 20% 80%, rgba(201,168,76,.06) 0%, transparent 60%),
    radial-gradient(ellipse 100% 60% at 50% 100%, rgba(10,26,15,.8) 0%, transparent 80%);
}
.slide-cover .handle { position:absolute; top:28px; left:0; right:0; text-align:center; font-size:9px; letter-spacing:4px; color:rgba(201,168,76,.7); text-transform:uppercase; font-weight:600; z-index:5; }
.slide-cover .cover-content { position:absolute; top:50%; left:0; right:0; transform:translateY(-54%); padding:0 40px; z-index:5; text-align:center; }
.slide-cover .cover-label { font-size:9px; letter-spacing:5px; color:var(--gold); text-transform:uppercase; font-weight:700; margin-bottom:20px; opacity:.8; }
.slide-cover .cover-line { width:30px; height:1px; background:var(--gold); margin:0 auto 16px; opacity:.6; }
.slide-cover .cover-title { font-size:36px; font-weight:800; line-height:1.05; letter-spacing:-.5px; text-transform:uppercase; color:var(--white); margin-bottom:12px; }
.slide-cover .cover-keyword { font-family:'Playfair Display',Georgia,serif; font-style:italic; font-size:42px; color:var(--gold); line-height:1; display:block; margin-bottom:18px; }
.slide-cover .cover-subtitle { font-size:11px; color:var(--gray); letter-spacing:1px; line-height:1.6; max-width:320px; margin:0 auto; }
.slide-cover .swipe-hint { position:absolute; bottom:28px; left:0; right:0; text-align:center; font-size:9px; letter-spacing:4px; color:rgba(255,255,255,.3); text-transform:uppercase; z-index:5; }

/* INSIGHT */
.slide-insight { background:#070707; }
.slide-insight .bg-spotlight { position:absolute; inset:0; }
.slide-insight.variant-a .bg-spotlight { background: radial-gradient(ellipse 70% 60% at 80% 30%, rgba(10,26,15,.9) 0%, transparent 70%), radial-gradient(ellipse 50% 40% at 10% 70%, rgba(201,168,76,.04) 0%, transparent 60%); }
.slide-insight.variant-b .bg-spotlight { background: radial-gradient(ellipse 80% 50% at 20% 20%, rgba(15,30,20,.8) 0%, transparent 70%), radial-gradient(ellipse 60% 50% at 90% 90%, rgba(5,15,10,.6) 0%, transparent 60%); }
.slide-insight.variant-c .bg-spotlight { background: radial-gradient(ellipse 100% 40% at 50% 0%, rgba(201,168,76,.05) 0%, transparent 60%), radial-gradient(ellipse 60% 60% at 50% 100%, rgba(10,26,15,.8) 0%, transparent 70%); }
.slide-insight.variant-d .bg-spotlight { background: radial-gradient(ellipse 60% 60% at 0% 50%, rgba(10,26,15,.7) 0%, transparent 70%), radial-gradient(ellipse 40% 40% at 100% 20%, rgba(201,168,76,.04) 0%, transparent 60%); }
.slide-insight.variant-e .bg-spotlight { background: radial-gradient(ellipse 80% 80% at 50% 50%, rgba(8,22,12,.9) 0%, transparent 80%), radial-gradient(ellipse 30% 30% at 80% 80%, rgba(201,168,76,.05) 0%, transparent 50%); }
.slide-insight .counter { position:absolute; top:28px; left:36px; font-size:9px; letter-spacing:4px; color:rgba(201,168,76,.5); font-weight:700; z-index:5; }
.slide-insight .handle { position:absolute; top:28px; right:36px; font-size:9px; letter-spacing:3px; color:rgba(255,255,255,.2); z-index:5; }
.slide-insight .insight-content { position:absolute; top:0; left:0; right:0; bottom:0; padding:72px 36px 56px; display:flex; flex-direction:column; justify-content:center; z-index:5; }
.slide-insight .insight-keyword { font-family:'Playfair Display',Georgia,serif; font-style:italic; font-size:48px; color:var(--gold); line-height:1; margin-bottom:16px; display:block; }
.slide-insight .insight-title { font-size:16px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; color:var(--white); line-height:1.2; margin-bottom:18px; }
.slide-insight .divider { width:24px; height:1px; background:var(--gold); margin-bottom:18px; opacity:.5; }
.slide-insight .insight-body { font-size:13px; color:var(--lgray); line-height:1.7; letter-spacing:.2px; font-weight:300; }
.slide-insight .bottom-handle { position:absolute; bottom:24px; left:0; right:0; text-align:center; font-size:8px; letter-spacing:3px; color:rgba(201,168,76,.35); font-weight:700; text-transform:uppercase; z-index:5; }

/* CTA */
.slide-cta { background:#070707; }
.slide-cta .bg-spotlight { position:absolute; inset:0; background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(201,168,76,.06) 0%, transparent 70%), radial-gradient(ellipse 60% 80% at 50% 100%, rgba(10,26,15,.9) 0%, transparent 70%); }
.slide-cta .handle { position:absolute; top:28px; left:0; right:0; text-align:center; font-size:9px; letter-spacing:4px; color:rgba(201,168,76,.6); text-transform:uppercase; font-weight:700; z-index:5; }
.slide-cta .cta-content { position:absolute; top:0; left:0; right:0; bottom:0; padding:0 40px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; z-index:5; }
.slide-cta .cta-line { width:20px; height:1px; background:var(--gold); margin-bottom:24px; opacity:.6; }
.slide-cta .cta-main { font-size:22px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--white); line-height:1.15; margin-bottom:14px; }
.slide-cta .cta-keyword { font-family:'Playfair Display',Georgia,serif; font-style:italic; color:var(--gold); }
.slide-cta .cta-question { font-size:12px; color:var(--gray); line-height:1.6; letter-spacing:.3px; font-style:italic; margin-top:20px; max-width:300px; }
.slide-cta .cta-follow { position:absolute; bottom:28px; left:0; right:0; text-align:center; z-index:5; }
.slide-cta .follow-text { font-size:8px; letter-spacing:3px; color:rgba(255,255,255,.2); text-transform:uppercase; display:block; margin-bottom:4px; }
.slide-cta .follow-handle { font-size:11px; letter-spacing:2px; color:var(--gold); font-weight:700; }

/* ── EXPORT HIDDEN CANVAS ── */
#export-canvas-wrapper { position:fixed; top:-9999px; left:-9999px; width:1080px; height:1350px; overflow:hidden; z-index:-1; }
#export-slide { width:1080px; height:1350px; position:relative; overflow:hidden; }
#export-slide .slide-cover .cover-title { font-size:72px; }
#export-slide .slide-cover .cover-keyword { font-size:84px; }
#export-slide .slide-cover .cover-subtitle { font-size:22px; max-width:640px; }
#export-slide .slide-cover .cover-label { font-size:18px; }
#export-slide .slide-cover .handle { font-size:18px; top:56px; }
#export-slide .slide-cover .swipe-hint { font-size:18px; bottom:56px; letter-spacing:8px; }
#export-slide .slide-cover .cover-content { padding:0 80px; }
#export-slide .slide-cover .cover-line { width:60px; margin-bottom:32px; }
#export-slide .slide-insight .counter { font-size:18px; top:56px; left:72px; }
#export-slide .slide-insight .handle { font-size:18px; top:56px; right:72px; }
#export-slide .slide-insight .insight-content { padding:144px 72px 112px; }
#export-slide .slide-insight .insight-keyword { font-size:96px; margin-bottom:32px; }
#export-slide .slide-insight .insight-title { font-size:32px; letter-spacing:3px; margin-bottom:36px; }
#export-slide .slide-insight .divider { width:48px; margin-bottom:36px; }
#export-slide .slide-insight .insight-body { font-size:26px; line-height:1.8; }
#export-slide .slide-insight .bottom-handle { font-size:16px; bottom:48px; letter-spacing:6px; }
#export-slide .slide-cta .handle { font-size:18px; top:56px; }
#export-slide .slide-cta .cta-content { padding:0 80px; }
#export-slide .slide-cta .cta-line { width:40px; margin-bottom:48px; }
#export-slide .slide-cta .cta-main { font-size:44px; line-height:1.15; margin-bottom:28px; }
#export-slide .slide-cta .cta-question { font-size:24px; max-width:600px; margin-top:40px; }
#export-slide .slide-cta .follow-text { font-size:16px; margin-bottom:8px; }
#export-slide .slide-cta .follow-handle { font-size:22px; }
#export-slide .slide-cta .cta-follow { bottom:56px; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-header">
    <div class="brand-logo">@mateo.corva</div>
    <div class="sidebar-sub">10 Carousels · Instagram System</div>
  </div>
  <div class="day-list" id="dayList"></div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="top-day" id="topDay">DAY 1</div>
      <div class="top-title" id="topTitle">—</div>
      <div class="top-meta">
        <div id="topCat"></div>
        <div class="slide-count-label" id="topCount">7 SLIDES</div>
      </div>
    </div>
    <div class="top-bar-right">
      <button class="btn-export-all" id="btnExportAll" onclick="exportAll()">&#8595; Export All PNGs</button>
    </div>
  </div>

  <div class="slides-scroll">
    <div class="slides-grid" id="slidesGrid"></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">&#10005;</button>
  <div class="lb-slide" id="lbSlide"></div>
  <div class="lb-controls">
    <button class="lb-btn" id="lbPrev" onclick="lbNav(-1)">&#8592;</button>
    <div class="lb-counter" id="lbCounter">1 / 7</div>
    <button class="lb-btn" id="lbNext" onclick="lbNav(1)">&#8594;</button>
    <button class="lb-export" onclick="exportSingle()">&#8595; PNG</button>
  </div>
</div>

<!-- Export canvas -->
<div id="export-canvas-wrapper">
  <div id="export-slide"></div>
</div>

<script>
const CAROUSELS = [
  {
    day: 1, topic: "The Moment Scouts Stop Watching You", category: "Scouting",
    slides: [
      { type:"cover", label:"Scouting Intelligence", titleLines:["THE MOMENT","SCOUTS STOP"], keyword:"Watching You", subtitle:"What happens in the first 5 minutes that decides your career" },
      { type:"insight", variant:"a", counter:"01 / 06", keyword:"Body Language", title:"YOUR ATTITUDE BEFORE THE BALL ARRIVES", body:"Scouts don't wait for mistakes. They read how you carry yourself when the game isn't in your zone. Slumped shoulders end evaluations before a touch is made." },
      { type:"insight", variant:"b", counter:"02 / 06", keyword:"Effort", title:"ONE SPRINT WITHOUT POSSESSION", body:"Not pressing when you should. Not tracking back. That single moment of laziness ends the evaluation. Scouts mark the timestamp and close the notebook." },
      { type:"insight", variant:"c", counter:"03 / 06", keyword:"Reaction", title:"HOW YOU RESPOND AFTER LOSING THE BALL", body:"A player who stops for 3 seconds after a mistake reveals everything about their competitive ceiling. Elite players react before the emotion does." },
      { type:"insight", variant:"d", counter:"04 / 06", keyword:"Positioning", title:"WHERE YOU STAND WHEN OTHERS HAVE THE BALL", body:"Off-ball intelligence is the highest form of football IQ. Scouts see it before they see your touch. Most players only perform when the ball is at their feet." },
      { type:"insight", variant:"e", counter:"05 / 06", keyword:"Communication", title:"DO YOU TALK WITHOUT THE BALL?", body:"Elite environments run on verbal leadership. Silent players are invisible players in the scout's notebook. The voice is a data point, not a personality trait." },
      { type:"cta", main:["SCOUTS DON'T EVALUATE","SKILLS. THEY EVALUATE","Habits."], keyword_index:2, question:"What habit would a scout catch on you right now? Save this and answer honestly." }
    ]
  },
  {
    day: 2, topic: "Why the 4-3-3 Is Dying in Modern Football", category: "Tactics",
    slides: [
      { type:"cover", label:"Tactical Analysis", titleLines:["WHY THE 4-3-3","IS DYING IN"], keyword:"Modern Football", subtitle:"The system that built dynasties is losing the tactical war" },
      { type:"insight", variant:"a", counter:"01 / 06", keyword:"Midfield", title:"IT LEAVES TOO MUCH SPACE IN THE CENTER", body:"The 4-3-3 was designed for controlled possession. Against high-press systems, the central triangle collapses under coordinated pressure. The math doesn't add up." },
      { type:"insight", variant:"b", counter:"02 / 06", keyword:"Wingers", title:"THE MODERN WINGER IS UNPLAYABLE IN THIS SYSTEM", body:"Today's wingers cut inside, overload half-spaces, and demand freedom. The 4-3-3 asks them to stay wide. That positional mismatch costs goals every week." },
      { type:"insight", variant:"c", counter:"03 / 06", keyword:"Fullbacks", title:"INVERTED FULLBACKS BREAK THE STRUCTURE", body:"When fullbacks push high and inside, the back four becomes a back two. High defensive lines become suicidal without the defensive width to cover transitions." },
      { type:"insight", variant:"d", counter:"04 / 06", keyword:"Adaptability", title:"TOP CLUBS SHIFT SHAPES WITHIN THE SAME PHASE", body:"Pep's City moves between 3-2-5, 4-2-4, and 2-3-5 in the same possession sequence. It's not a system anymore. It's a language. The 4-3-3 is a fixed phrase." },

const CAT_CLASS = { Scouting:'cat-scouting', Tactics:'cat-tactics', News:'cat-news', Business:'cat-business', Facts:'cat-facts', Data:'cat-data', Mentality:'cat-mentality', Development:'cat-development' };

let currentDay = 0;
let lbSlideIndex = 0;

// ── BUILD SLIDE HTML ──
function buildSlide(slide) {
  if (slide.type === 'cover') return `
    <div class="slide slide-cover">
      <div class="bg-spotlight"></div>
      <div class="handle">@mateo.corva</div>
      <div class="cover-content">
        <div class="cover-label">${slide.label}</div>
        <div class="cover-line"></div>
        <div class="cover-title">${slide.titleLines.join('<br>')}</div>
        <span class="cover-keyword">${slide.keyword}</span>
        <div class="cover-subtitle">${slide.subtitle}</div>
      </div>
      <div class="swipe-hint">Swipe &rarr;</div>
    </div>`;

  if (slide.type === 'insight') return `
    <div class="slide slide-insight variant-${slide.variant}">
      <div class="bg-spotlight"></div>
      <div class="counter">${slide.counter}</div>
      <div class="handle">@mateo.corva</div>
      <div class="insight-content">
        <span class="insight-keyword">${slide.keyword}</span>
        <div class="insight-title">${slide.title}</div>
        <div class="divider"></div>
        <div class="insight-body">${slide.body}</div>
      </div>
      <div class="bottom-handle">@mateo.corva</div>
    </div>`;

  if (slide.type === 'cta') {
    const lines = slide.main.map((l,i) => i===slide.keyword_index ? `<span class="cta-keyword">${l}</span>` : l).join('<br>');
    return `
    <div class="slide slide-cta">
      <div class="bg-spotlight"></div>
      <div class="handle">@mateo.corva</div>
      <div class="cta-content">
        <div class="cta-line"></div>
        <div class="cta-main">${lines}</div>
        <div class="cta-question">${slide.question}</div>
      </div>
      <div class="cta-follow">
        <span class="follow-text">Follow for more</span>
        <span class="follow-handle">@mateo.corva</span>
      </div>
    </div>`;
  }
  return '';
}

// ── SIDEBAR ──
function renderSidebar() {
  document.getElementById('dayList').innerHTML = CAROUSELS.map((c,i) => `
    <div class="day-item ${i===currentDay?'active':''}" onclick="loadDay(${i})">
      <span class="day-num">${String(c.day).padStart(2,'0')}</span>
      <div class="day-info">
        <div class="day-topic">${c.topic}</div>
        <span class="cat-tag ${CAT_CLASS[c.category]}">${c.category}</span>
      </div>
    </div>`).join('');
}

// ── MAIN GRID ──
function renderGrid() {
  const c = CAROUSELS[currentDay];
  document.getElementById('topDay').textContent = `DAY ${c.day}`;
  document.getElementById('topTitle').textContent = c.topic;
  document.getElementById('topCat').innerHTML = `<span class="cat-tag ${CAT_CLASS[c.category]}">${c.category}</span>`;
  document.getElementById('topCount').textContent = `${c.slides.length} SLIDES`;

  const typeLabel = { cover:'Cover', insight:'Insight', cta:'CTA' };
  const SCALE = 0.4; // 216/540

  document.getElementById('slidesGrid').innerHTML = c.slides.map((slide, i) => `
    <div class="slide-card">
      <div class="card-preview" onclick="openLightbox(${i})" title="Click to preview full size">
        <div class="slide-inner-wrap" style="transform:scale(${SCALE})">${buildSlide(slide)}</div>
      </div>
      <div class="card-footer">
        <span class="card-num">SLIDE ${String(i+1).padStart(2,'0')}</span>
        <span class="card-type">${typeLabel[slide.type]||''}</span>
        <button class="btn-card-export" onclick="exportSlide(${i},event)">↓ PNG</button>
      </div>
    </div>`).join('');

  // Fix card heights after render
  requestAnimationFrame(() => {
    document.querySelectorAll('.card-preview').forEach(el => {
      const w = el.offsetWidth;
      el.style.height = `${w * 1.25}px`;
      const wrap = el.querySelector('.slide-inner-wrap');
      if (wrap) {
        const scale = w / 540;
        wrap.style.transform = `scale(${scale})`;
        wrap.style.width = '540px';
        wrap.style.height = '675px';
      }
    });
  });
}

function loadDay(i) {
  currentDay = i;
  renderSidebar();
  renderGrid();
}

// ── LIGHTBOX ──
function openLightbox(i) {
  lbSlideIndex = i;
  updateLightbox();
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

function updateLightbox() {
  const c = CAROUSELS[currentDay];
  document.getElementById('lbSlide').innerHTML =
    `<div class="slide-inner-wrap" style="transform:scale(0.75);width:540px;height:675px;position:absolute;top:0;left:0;">${buildSlide(c.slides[lbSlideIndex])}</div>`;
  document.getElementById('lbCounter').textContent = `${lbSlideIndex+1} / ${c.slides.length}`;
  document.getElementById('lbPrev').disabled = lbSlideIndex === 0;
  document.getElementById('lbNext').disabled = lbSlideIndex === c.slides.length - 1;
}

function lbNav(dir) {
  const c = CAROUSELS[currentDay];
  lbSlideIndex = Math.max(0, Math.min(c.slides.length-1, lbSlideIndex + dir));
  updateLightbox();
}

document.getElementById('lightbox').addEventListener('click', function(e) {
  if (e.target === this) closeLightbox();
});

document.addEventListener('keydown', e => {
  const lb = document.getElementById('lightbox');
  if (!lb.classList.contains('open')) return;
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
  if (e.key === 'Escape') closeLightbox();
});

// ── EXPORT ──
async function doExport(slideIndex) {
  const c = CAROUSELS[currentDay];
  const exportEl = document.getElementById('export-slide');
  exportEl.innerHTML = buildSlide(c.slides[slideIndex]);
  await document.fonts.ready;
  await new Promise(r => setTimeout(r, 150));
  const canvas = await html2canvas(exportEl, {
    width:1080, height:1350, scale:1,
    useCORS:true, allowTaint:true,
    backgroundColor:'#070707', logging:false
  });
  const link = document.createElement('a');
  link.download = `mateo-corva-day${c.day}-slide${slideIndex+1}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  exportEl.innerHTML = '';
}

async function exportSlide(i, e) {
  e.stopPropagation();
  const btn = e.target;
  btn.textContent = '...';
  await doExport(i);
  btn.textContent = '↓ PNG';
}

async function exportSingle() {
  await doExport(lbSlideIndex);
}

async function exportAll() {
  const btn = document.getElementById('btnExportAll');
  btn.disabled = true;
  const c = CAROUSELS[currentDay];
  for (let i = 0; i < c.slides.length; i++) {
    btn.textContent = `Exporting ${i+1}/${c.slides.length}...`;
    await doExport(i);
    await new Promise(r => setTimeout(r, 400));
  }
  btn.disabled = false;
  btn.textContent = '↓ Export All PNGs';
}

// ── INIT ──
loadDay(0);
</script>
