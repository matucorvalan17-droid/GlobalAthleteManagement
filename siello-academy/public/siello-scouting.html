<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Siello Academy — Performance Reports</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#F5A623;--gold-dark:#D4880A;--gold-light:#FFC85C;
  --bg:#080808;--surface:#111114;--surface2:#18181C;--surface3:#222228;
  --border:#2A2A32;--borderl:#3A3A44;
  --teal:#14B8A6;--indigo:#818CF8;--red:#F87171;
  --text:#F4F4F5;--muted:#71717A;--dim:#3F3F46;
  --font:Helvetica,Arial,sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;height:100%}
#root{height:100%}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--borderl);border-radius:2px}
input,select,textarea{font-family:var(--font);font-size:13px;color:var(--text)}
textarea{resize:none}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;width:100%}
input[type=range]::-webkit-slider-track{background:var(--surface3);height:4px;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;background:var(--gold);height:16px;width:16px;border-radius:50%;margin-top:-6px;box-shadow:0 0 8px rgba(245,166,35,.4)}
input[type=range]:focus{outline:none}
.grid-bg{background-image:linear-gradient(rgba(245,166,35,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(245,166,35,.015) 1px,transparent 1px);background-size:32px 32px}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#000;border:none;cursor:pointer;font-family:var(--font);font-weight:700;border-radius:8px;transition:opacity .15s,transform .1s}
.btn-gold:hover{opacity:.88}
.btn-gold:active{transform:scale(.97)}
.btn-ghost{background:var(--surface2);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-family:var(--font);border-radius:8px;transition:all .15s}
.btn-ghost:hover{border-color:var(--borderl);color:var(--text)}
.input-field{background:var(--surface3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;width:100%;font-family:var(--font)}
.input-field:focus{border-color:rgba(245,166,35,.5);outline:none;box-shadow:0 0 0 2px rgba(245,166,35,.08)}
.card{background:var(--surface2);border:1px solid var(--border);border-radius:12px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script type="text/babel">
const {useState,useEffect,useRef} = React;

// ─── LOGO SVG ─────────────────────────────────────────────────────

  return (
    <svg height={h} viewBox="0 0 172 46" style={{display:'block',flexShrink:0}}>

        fill={white?"rgba(255,255,255,0.9)":"url(#sg)"} stroke="none"/>
      <defs>
        <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="#FFC85C"/>
          <stop offset="100%" stopColor="#D4880A"/>
        </linearGradient>
      </defs>
      <text x="21" y="25" textAnchor="middle" dominantBaseline="middle"
        fontFamily="Helvetica,Arial,sans-serif" fontWeight="900" fontSize="20" fill={white?"#111":"#000"}>S</text>
      <text x="47" y="20" fontFamily="Helvetica,Arial,sans-serif"
        fontWeight="900" fontSize="18" fill={c} letterSpacing="1">SIELLO</text>
      <text x="48" y="36" fontFamily="Helvetica,Arial,sans-serif"

}

function SielloShield({size=36}){
  return (
    <svg width={size} height={size} viewBox="0 0 42 42">
      <defs>
        <linearGradient id="shg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="#FFC85C"/><stop offset="100%" stopColor="#D4880A"/>
        </linearGradient>
      </defs>
      <path d="M4,4 L38,4 C38,4 38,30 21,40 C4,30 4,4 4,4 Z" fill="url(#shg)"/>
      <text x="21" y="23" textAnchor="middle" dominantBaseline="middle"
        fontFamily="Helvetica,Arial,sans-serif" fontWeight="900" fontSize="20" fill="#000">S</text>

// ─── CONSTANTS ────────────────────────────────────────────────────
const STATUS_CFG = {

  SIGN_NOW:{bg:'rgba(20,184,166,.1)',color:'#14B8A6',border:'rgba(20,184,166,.3)'},
  FOLLOW:{bg:'rgba(129,140,248,.1)',color:'#818CF8',border:'rgba(129,140,248,.3)'},
  INITIAL_FILTER:{bg:'rgba(252,211,77,.08)',color:'#FCD34D',border:'rgba(252,211,77,.25)'},
  PASS:{bg:'rgba(239,68,68,.08)',color:'#F87171',border:'rgba(239,68,68,.2)'},
  PENDING:{bg:'rgba(113,113,122,.1)',color:'#A1A1AA',border:'rgba(113,113,122,.2)'},

const STATUS_LABELS = {

    INITIAL_FILTER:'INITIAL FILTER',PASS:'PASS',PENDING:'PENDIENTE'},
  en:{ELITE_POTENTIAL:'ELITE POTENTIAL',SIGN_NOW:'SIGN NOW',FOLLOW:'FOLLOW',

  'Mediocentro Defensivo','Mediocentro','Mediocentro Ofensivo',
  'Extremo Derecho','Extremo Izquierdo','Delantero Centro','Segunda Punta'];

      {key:'aceleracion',   label:'ACELERACIÓN'},
      {key:'equilibrioAD',  label:'EQUILIBRIO\nATAQUE-DEFENSA'},
    ]
  },
  {
    id:'tecnicos', color:'#818CF8',
    label:{es:'VALORES TÉCNICOS',en:'TECHNICAL VALUES'},
    attrs:[
      {key:'controlPase',   label:'CONTROL Y PASE'},
      {key:'tecnicaPieND',  label:'TÉCNICA PIE\nNO DOMINANTE'},
      {key:'desmarque',     label:'DESMARQUE'},
      {key:'finalizacion',  label:'FINALIZACIÓN'},
      {key:'regate',        label:'REGATE'},
      {key:'movEspacio',    label:'MOVIMIENTO\nAL ESPACIO'},

  {
    id:'mentales', color:'#F5A623',
    label:{es:'VALORES MENTALES',en:'MENTAL VALUES'},
    attrs:[

      {key:'tomaDecisiones',label:'TOMA DE\nDECISIONES'},

  {key:'playerContext',    label:{es:'Contexto del Jugador', en:'Player Context'}, rows:3},
  {key:'technicalObs',    label:{es:'Observaciones Técnicas', en:'Technical Observations'}, rows:3},
  {key:'tacticalObs',     label:{es:'Observaciones Tácticas', en:'Tactical Observations'}, rows:3},
  {key:'physicalObs',     label:{es:'Observaciones Físicas', en:'Physical Observations'}, rows:3},
  {key:'mentality',       label:{es:'Mentalidad y Comportamiento', en:'Mentality & Behavior'}, rows:3},
  {key:'roleFit',         label:{es:'Role Fit', en:'Role Fit'}, rows:3},
  {key:'conclusion',      label:{es:'Conclusión Final', en:'Final Conclusion'}, rows:3},
  {key:'recommendation',  label:{es:'Recomendación Final', en:'Final Recommendation'}, rows:3},

// ─── STORAGE ──────────────────────────────────────────────────────
const STORE_KEY = 'siello_v3';
function loadReports(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'[]')}catch{return[]}}
function saveReports(r){localStorage.setItem(STORE_KEY,JSON.stringify(r))}

function newReport(){
  const id = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)+Date.now();
  return {
    id, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(),
    playerName:'', dateOfBirth:'', nationality:'', position:'',
    dominantFoot:'Diestro', height:'', weight:'', currentClub:'',
    evaluationDate:new Date().toISOString().split('T')[0],
    playerPhoto:'', clubLogo:'',
    overallScore:0, scoutingStatus:'PENDING',
    attributes:defaultAttrs(),
    executiveSummary:'', playerContext:'', technicalObs:'', tacticalObs:'',
    physicalObs:'', mentality:'', roleFit:'', conclusion:'', recommendation:'',
    suggestedTeams:[],
  };

// ─── HELPERS ──────────────────────────────────────────────────────
function barColor(v){
  if(v>=8) return '#14B8A6';
  if(v>=6.5) return '#F5A623';
  if(v>=4.5) return '#FCD34D';
  return '#F87171';
}
function calcAge(dob){
  if(!dob) return null;
  const b=new Date(dob), now=new Date();
  let a=now.getFullYear()-b.getFullYear();
  if(now.getMonth()<b.getMonth()||(now.getMonth()===b.getMonth()&&now.getDate()<b.getDate())) a--;
  return a;
}
function fmtDate(iso,lang){
  try{return new Intl.DateTimeFormat(lang==='es'?'es-ES':'en-US',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(iso))}
  catch{return iso||''}
}

// ─── STATUS BADGE ─────────────────────────────────────────────────
function StatusBadge({status,lang,size='md'}){
  const cfg=STATUS_CFG[status]||STATUS_CFG.PENDING;
  const label=STATUS_LABELS[lang]?.[status]||status;
  const pad=size==='sm'?'3px 8px':size==='lg'?'6px 14px':'4px 10px';
  const fs=size==='lg'?11:9;
  return (
    <span style={{display:'inline-flex',alignItems:'center',gap:6,padding:pad,
      borderRadius:20,background:cfg.bg,border:`1px solid ${cfg.border}`,
      color:cfg.color,fontSize:fs,fontWeight:700,letterSpacing:'0.12em',
      textTransform:'uppercase',fontFamily:'Helvetica,Arial,sans-serif'}}>
      <span style={{width:5,height:5,borderRadius:'50%',background:cfg.color,
        animation:'blink 2s infinite',flexShrink:0}}/>
      {label}
    </span>
  );
}

// ─── HEXAGON CHART ────────────────────────────────────────────────
function HexChart({attrs,values,color,size=220}){
  const n=attrs.length;
  const cx=size/2, cy=size/2;
  const R=size*0.32;
  const Rl=size*0.46;

  function pt(i,frac=1){
    const a=(i*2*Math.PI/n)-Math.PI/2;
    return {x:cx+frac*R*Math.cos(a), y:cy+frac*R*Math.sin(a), a};
  }

  const gridLvls=[2,4,6,8,10];
  const scorePoly=attrs.map(({key},i)=>pt(i,(values[key]||0)/10));
  const scoreStr=scorePoly.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  return (
    <svg width={size} height={size} style={{overflow:'visible'}}>
      {/* Grid polygons */}
      {gridLvls.map(lv=>(
        <polygon key={lv}
          points={attrs.map((_,i)=>{const p=pt(i,lv/10);return `${p.x.toFixed(1)},${p.y.toFixed(1)}`}).join(' ')}
          fill="none" stroke="#1E1E28" strokeWidth="1"/>
      ))}
      {/* Axes */}
      {attrs.map((_,i)=>{
        const p=pt(i);
        return <line key={i} x1={cx.toFixed(1)} y1={cy.toFixed(1)}
          x2={p.x.toFixed(1)} y2={p.y.toFixed(1)} stroke="#1E1E28" strokeWidth="1"/>;
      })}
      {/* Score polygon */}
      <polygon points={scoreStr}
        fill={color+'25'} stroke={color} strokeWidth="1.5"/>
      {/* Dots */}
      {scorePoly.map((p,i)=>(
        <circle key={i} cx={p.x.toFixed(1)} cy={p.y.toFixed(1)} r="3.5"
          fill={color} stroke="#080810" strokeWidth="1.5"/>
      ))}
      {/* Labels */}
      {attrs.map(({key,label},i)=>{
        const {x,y,a}=pt(i,1);
        const lx=cx+(Rl)*Math.cos(a);
        const ly=cy+(Rl)*Math.sin(a);
        const cos=Math.cos(a), sin=Math.sin(a);
        const anchor=cos>0.25?'start':cos<-0.25?'end':'middle';
        const parts=label.split('\n');
        const lineH=9;
        const totalH=parts.length*lineH;
        const yOff=sin<-0.2?-totalH:sin>0.2?0:-totalH/2;
        return (
          <text key={i} textAnchor={anchor}
            fontFamily="Helvetica,Arial,sans-serif" fontSize="7.5"
            fontWeight="600" fill="#8B949E" letterSpacing="0.04em">
            {parts.map((part,j)=>(
              <tspan key={j} x={lx.toFixed(1)} y={(ly+yOff+j*lineH).toFixed(1)}>{part}</tspan>
            ))}
          </text>
        );
      })}
    </svg>
  );
}

// ─── SIDEBAR ──────────────────────────────────────────────────────
function Sidebar({view,onNav,lang,setLang}){
  const nav=[
    {k:'dashboard',icon:'≡',tip:'Dashboard'},
    {k:'new',icon:'+',tip:'Nuevo Reporte'},
  ];
  return (
    <aside style={{position:'fixed',left:0,top:0,height:'100%',width:58,
      background:'var(--surface)',borderRight:'1px solid var(--border)',
      display:'flex',flexDirection:'column',zIndex:50}}>
      <div style={{padding:'14px 0',borderBottom:'1px solid var(--border)',
        display:'flex',justifyContent:'center',alignItems:'center'}}>
        <SielloShield size={34}/>
      </div>
      <nav style={{flex:1,padding:'10px 6px',display:'flex',flexDirection:'column',gap:3}}>
        {nav.map(({k,icon,tip})=>{
          const active=view===k||(k==='dashboard'&&(view==='form'||view==='preview'));
          return (
            <button key={k} onClick={()=>onNav(k)} title={tip}
              style={{width:'100%',height:40,borderRadius:8,border:'none',cursor:'pointer',
                fontFamily:'var(--font)',fontWeight:700,fontSize:18,
                background:active?'rgba(245,166,35,.1)':'transparent',
                color:active?'var(--gold)':'var(--dim)',transition:'all .15s',
                display:'flex',alignItems:'center',justifyContent:'center',
                letterSpacing:'-1px'}}>
              {icon}
            </button>
          );
        })}
      </nav>
      <div style={{padding:'10px 6px',borderTop:'1px solid var(--border)',
        display:'flex',flexDirection:'column',gap:3}}>
        {['es','en'].map(l=>(
          <button key={l} onClick={()=>setLang(l)}
            style={{padding:'4px 0',borderRadius:5,border:'none',cursor:'pointer',
              fontSize:9,fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',
              fontFamily:'var(--font)',
              background:lang===l?'rgba(245,166,35,.12)':'transparent',
              color:lang===l?'var(--gold)':'var(--dim)',transition:'all .15s'}}>
            {l}
          </button>
        ))}
      </div>
    </aside>
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────────
function Dashboard({reports,lang,onNew,onOpen,onDelete}){
  const stats={
    total:reports.length,
    elite:reports.filter(r=>r.scoutingStatus==='ELITE_POTENTIAL').length,
    follow:reports.filter(r=>['FOLLOW','SIGN_NOW'].includes(r.scoutingStatus)).length,
  };
  const lbl={
    es:{total:'Reportes Totales',elite:'Potencial Elite',follow:'En Seguimiento',
      activity:'Actividad Reciente',empty:'No hay reportes',emptySub:'Creá tu primer reporte',
      create:'Crear Reporte',new:'Nuevo Reporte'},
    en:{total:'Total Reports',elite:'Elite Potential',follow:'Follow List',
      activity:'Recent Activity',empty:'No reports yet',emptySub:'Create your first report',
      create:'Create Report',new:'New Report'},
  }[lang];
  return (
    <div className="grid-bg" style={{minHeight:'100vh',padding:'36px 32px'}}>
      {/* Header */}
      <div style={{marginBottom:32}}>
        <SielloLogo h={32}/>
        <p style={{fontSize:12,color:'var(--muted)',marginTop:10,letterSpacing:'.05em'}}>
          {lang==='es'?'Plataforma de generación de reportes premium':'Premium report generation platform'}
        </p>
      </div>

      {/* Stats */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:32}}>
        {[
          {label:lbl.total, value:stats.total, color:'var(--gold)'},
          {label:lbl.elite, value:stats.elite, color:'var(--teal)'},
          {label:lbl.follow,value:stats.follow,color:'var(--indigo)'},
        ].map(s=>(
          <div key={s.label} className="card" style={{padding:'18px 16px'}}>
            <div style={{fontSize:30,fontWeight:900,color:s.color,marginBottom:4}}>
              {s.value}
            </div>
            <div style={{fontSize:11,color:'var(--muted)'}}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* List header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
        <h2 style={{fontSize:14,fontWeight:700,color:'var(--text)'}}>{lbl.activity}</h2>
        <button className="btn-gold" style={{padding:'8px 16px',fontSize:12}} onClick={onNew}>
          + {lbl.new}
        </button>
      </div>

      {/* List */}
      {reports.length===0
        ? <div className="card" style={{padding:'56px 32px',textAlign:'center'}}>
            <div style={{fontSize:36,marginBottom:12,opacity:.3}}>&#9776;</div>
            <h3 style={{fontSize:18,fontWeight:700,marginBottom:8}}>{lbl.empty}</h3>
            <p style={{fontSize:13,color:'var(--muted)',marginBottom:24}}>{lbl.emptySub}</p>
            <button className="btn-gold" style={{padding:'10px 24px',fontSize:13}} onClick={onNew}>
              {lbl.create}
            </button>
          </div>
        : <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {reports.map(r=>(
              <div key={r.id} className="card"
                onClick={()=>onOpen(r.id)}
                style={{padding:'13px 16px',cursor:'pointer',display:'flex',
                  alignItems:'center',gap:14,transition:'border-color .15s'}}
                onMouseEnter={e=>e.currentTarget.style.borderColor='rgba(245,166,35,.25)'}
                onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
                {/* Avatar */}
                <div style={{width:42,height:42,borderRadius:9,overflow:'hidden',
                  background:'var(--surface3)',border:'1px solid var(--border)',
                  flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                  {r.playerPhoto
                    ? <img src={r.playerPhoto} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                    : <span style={{fontSize:16,fontWeight:900,color:'var(--gold)'}}>
                        {r.playerName?.charAt(0)?.toUpperCase()||'?'}
                      </span>
                  }
                </div>
                {/* Info */}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:3}}>
                    <span style={{fontWeight:700,fontSize:14,
                      overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                      {r.playerName||'Sin nombre'}
                    </span>
                    <StatusBadge status={r.scoutingStatus} lang={lang} size="sm"/>
                  </div>
                  <div style={{fontSize:11,color:'var(--muted)',
                    overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                    {[r.position,r.currentClub,fmtDate(r.updatedAt,lang)].filter(Boolean).join(' · ')}
                  </div>
                </div>
                {/* Score pill */}
                <div style={{
                  width:36,height:36,borderRadius:'50%',flexShrink:0,
                  display:'flex',alignItems:'center',justifyContent:'center',
                  fontWeight:900,fontSize:13,
                  color:barColor(r.overallScore||0),
                  border:`2px solid ${barColor(r.overallScore||0)}`,
                  background:`radial-gradient(circle,${barColor(r.overallScore||0)}20 0%,transparent 70%)`}}>
                  {(r.overallScore||0).toFixed(1)}
                </div>
                {/* Delete */}
                <button
                  onClick={e=>{e.stopPropagation();if(confirm(lang==='es'?'Eliminar reporte?':'Delete report?'))onDelete(r.id)}}
                  style={{background:'none',border:'none',cursor:'pointer',
                    color:'var(--dim)',fontSize:16,padding:'4px 8px',transition:'color .15s'}}
                  onMouseEnter={e=>e.currentTarget.style.color='var(--red)'}
                  onMouseLeave={e=>e.currentTarget.style.color='var(--dim)'}>
                  x
                </button>
              </div>
            ))}
          </div>
      }
    </div>
  );
}

// ─── FORM: PLAYER INFO ────────────────────────────────────────────
function PhotoUpload({value,onChange,label}){
  const ref=useRef();
  function handleFile(e){
    const f=e.target.files?.[0]; if(!f) return;
    const r=new FileReader(); r.onload=ev=>onChange(ev.target.result); r.readAsDataURL(f);
  }
  return (
    <div onClick={()=>ref.current?.click()}
      style={{position:'relative',width:'100%',aspectRatio:'4/3',borderRadius:10,
        background:'var(--surface3)',border:'2px dashed var(--border)',
        display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
        cursor:'pointer',overflow:'hidden'}}
      onMouseEnter={e=>e.currentTarget.style.borderColor='rgba(245,166,35,.5)'}
      onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
      <input ref={ref} type="file" accept="image/*" style={{display:'none'}} onChange={handleFile}/>
      {value
        ? <img src={value} style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover'}}/>
        : <div style={{textAlign:'center',padding:12}}>
            <div style={{fontSize:22,marginBottom:8,opacity:.4}}>[ ]</div>
            <div style={{fontSize:11,color:'var(--muted)'}}>{label}</div>
          </div>
      }
    </div>
  );
}

function Lbl({text}){

// ─── FORM: EVALUATION ─────────────────────────────────────────────
function AttrSlider({label,value,onChange,color}){
  const c=color||barColor(value);
  const pct=(value/10)*100;
  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
        <span style={{fontSize:11,fontWeight:600,color:'var(--muted)'}}>{label.replace('\n',' ')}</span>
        <span style={{fontSize:11,fontWeight:700,color:c}}>{value.toFixed(1)}</span>
      </div>
      <div style={{height:4,borderRadius:2,background:'var(--surface3)',marginBottom:4,position:'relative'}}>
        <div style={{position:'absolute',left:0,top:0,height:'100%',borderRadius:2,
          width:`${pct}%`,background:`linear-gradient(90deg,${c}60,${c})`}}/>
      </div>
      <input type="range" min={0} max={10} step={.1} value={value}
        onChange={e=>onChange(parseFloat(e.target.value))}
        style={{width:'100%'}}/>
    </div>
  );
}

function Step2({report,onChange,lang}){
  const upd=(k,v)=>onChange({attributes:{...report.attributes,[k]:v}});
  return (
    <div style={{display:'flex',flexDirection:'column',gap:24}}>
      {ATTR_GROUPS.map(g=>(
        <div key={g.id}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
            <div style={{width:3,height:16,borderRadius:2,background:g.color}}/>
            <span style={{fontSize:12,fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',color:'var(--text)'}}>
              {g.label[lang]}

          </div>
          <div className="card" style={{padding:16,display:'flex',flexDirection:'column',gap:14}}>
            {g.attrs.map(({key,label})=>(
              <AttrSlider key={key}
                label={label.replace('\n',' ')}
                value={report.attributes[key]||5}

}

// ─── FORM: TEXT SECTIONS ──────────────────────────────────────────
function Step3({report,onChange,lang}){

// ─── FORM: TEAMS ──────────────────────────────────────────────────

  const add=()=>onChange({suggestedTeams:[...report.suggestedTeams,{club:'',category:'',observations:'',estimatedLevel:''}]});
  const upd=(i,u)=>onChange({suggestedTeams:report.suggestedTeams.map((t,j)=>j===i?{...t,...u}:t)});

  const L={
    es:{title:'Posibles Equipos en España',sub:'Clubes españoles donde podría encajar el jugador',

      club:'Club',cat:'Categoría',level:'Nivel Estimado',obs:'Observaciones'},
    en:{title:'Possible Teams in Spain',sub:'Spanish clubs where the player could fit',
      add:'Add Club',empty:'No clubs yet. Add the first one.',
      club:'Club',cat:'Category',level:'Estimated Level',obs:'Observations'},

      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:6}}>

          <p style={{fontSize:13,color:'var(--muted)'}}>{L.empty}</p>

                fontSize:11,fontWeight:700,color:'var(--gold)'}}>{i+1}</div>
              <span style={{fontSize:14,fontWeight:700}}>{team.club||L.club}</span>

            <div><Lbl text={L.level}/><input className="input-field" value={team.estimatedLevel} onChange={e=>upd(i,{estimatedLevel:e.target.value})} placeholder="Alta probabilidad"/></div>
            <div><Lbl text={L.obs}/><input className="input-field" value={team.observations} onChange={e=>upd(i,{observations:e.target.value})} placeholder="Observaciones..."/></div>
          </div>
        </div>
      ))}
    </div>
  );
}

// ─── REPORT FORM WRAPPER ──────────────────────────────────────────
function ReportForm({report,onUpdate,onPreview,onBack,lang}){
  const [step,setStep]=useState(0);
  const [saved,setSaved]=useState(false);

  // *** BUG FIX: merge partial updates with full report before calling onUpdate
  function handleChange(updates){
    onUpdate({...report,...updates,updatedAt:new Date().toISOString()});
  }

  function handleSave(){setSaved(true);setTimeout(()=>setSaved(false),2000)}
  function handleNext(){handleSave();if(step<3)setStep(s=>s+1)}

  const STEPS_L={
    es:['Datos','Evaluación','Observaciones','Equipos'],
    en:['Player','Evaluation','Observations','Teams'],
  }[lang];

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      {/* Steps */}
      <div style={{padding:'18px 22px 14px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:4}}>
          {STEPS_L.map((s,i)=>(
            <React.Fragment key={i}>
              <button onClick={()=>setStep(i)}
                style={{display:'flex',alignItems:'center',gap:5,background:'none',
                  border:'none',cursor:'pointer',padding:'2px 4px'}}>
                <div style={{width:20,height:20,borderRadius:'50%',display:'flex',
                  alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:700,
                  flexShrink:0,transition:'all .15s',fontFamily:'var(--font)',
                  background:i===step?'var(--gold)':i<step?'rgba(245,166,35,.3)':'var(--surface3)',
                  color:i===step?'#000':i<step?'var(--gold)':'var(--muted)'}}>
                  {i<step?'✓':i+1}
                </div>
                <span style={{fontSize:11,fontWeight:600,whiteSpace:'nowrap',
                  color:i===step?'var(--text)':'var(--muted)'}}>{s}</span>
              </button>
              {i<3&&<div style={{flex:1,height:1,minWidth:8,
                background:i<step?'var(--gold)':'var(--border)'}}/>}
            </React.Fragment>
          ))}
        </div>
      </div>

      {/* Content */}
      <div style={{flex:1,overflowY:'auto',padding:'22px'}}>
        {step===0&&<Step1 report={report} onChange={handleChange} lang={lang}/>}
        {step===1&&<Step2 report={report} onChange={handleChange} lang={lang}/>}
        {step===2&&<Step3 report={report} onChange={handleChange} lang={lang}/>}
        {step===3&&<Step4 report={report} onChange={handleChange} lang={lang}/>}
      </div>

      {/* Footer */}
      <div style={{padding:'14px 22px',borderTop:'1px solid var(--border)',
        background:'var(--surface)',display:'flex',alignItems:'center',
        justifyContent:'space-between',gap:8,flexShrink:0}}>
        <button className="btn-ghost" style={{padding:'8px 14px',fontSize:12}}
          onClick={step===0?onBack:()=>setStep(s=>s-1)}>
          {step===0?'Dashboard':'← '+(lang==='es'?'Atrás':'Back')}
        </button>
        <div style={{display:'flex',gap:8}}>
          <button className="btn-ghost"
            style={{padding:'8px 14px',fontSize:12,
              color:saved?'var(--teal)':'var(--muted)',
              borderColor:saved?'rgba(20,184,166,.3)':'var(--border)'}}
            onClick={handleSave}>
            {saved?(lang==='es'?'Guardado':'Saved'):(lang==='es'?'Guardar':'Save')}
          </button>
          <button className="btn-ghost"
            style={{padding:'8px 14px',fontSize:12,color:'var(--gold)',
              borderColor:'rgba(245,166,35,.2)'}}
            onClick={onPreview}>
            {lang==='es'?'Vista Previa':'Preview'}
          </button>
          {step<3
            ? <button className="btn-gold" style={{padding:'8px 16px',fontSize:12}}
                onClick={handleNext}>
                {lang==='es'?'Siguiente':'Next'} →
              </button>
            : <button className="btn-gold" style={{padding:'8px 16px',fontSize:12}}
                onClick={onPreview}>
                {lang==='es'?'Ver Reporte':'View Report'}
              </button>
          }
        </div>
      </div>
    </div>
  );
}

// ─── REPORT PREVIEW ───────────────────────────────────────────────
function ReportPreview({report,lang,onEdit}){
  const [exporting,setExporting]=useState(false);
  const age=calcAge(report.dateOfBirth);

  async function handleExport(){
    setExporting(true);
    try{
      const el=document.getElementById('pdf-layout');
      const canvas=await html2canvas(el,{
        scale:2,useCORS:true,allowTaint:true,
        backgroundColor:'#080810',logging:false,
        width:el.scrollWidth,height:el.scrollHeight,
        windowWidth:el.scrollWidth,windowHeight:el.scrollHeight,
      });
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF({orientation:'portrait',unit:'px',
        format:[canvas.width/2,canvas.height/2],compress:true});
      pdf.addImage(canvas.toDataURL('image/jpeg',.95),'JPEG',0,0,canvas.width/2,canvas.height/2);
      const name=(report.playerName||'report').replace(/\s+/g,'_');
      pdf.save(`Siello_${name}_Performance_Report.pdf`);
    }finally{setExporting(false)}
  }

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      {/* Topbar */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
        padding:'14px 22px',borderBottom:'1px solid var(--border)',
        background:'var(--surface)',flexShrink:0}}>
        <div>
          <h2 style={{fontSize:14,fontWeight:700}}>
            {lang==='es'?'Vista Previa del Reporte':'Report Preview'}
          </h2>
          <p style={{fontSize:11,color:'var(--muted)',marginTop:2}}>
            {lang==='es'?'PDF premium listo para exportar':'Premium PDF ready to export'}
          </p>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn-ghost" style={{padding:'8px 14px',fontSize:12}} onClick={onEdit}>
            {lang==='es'?'Editar':'Edit'}
          </button>
          <button className="btn-gold" style={{padding:'9px 18px',fontSize:12,
            display:'flex',alignItems:'center',gap:6,opacity:exporting?.7:1}}
            onClick={handleExport} disabled={exporting}>
            {exporting
              ? <><span style={{animation:'spin 1s linear infinite',display:'inline-block'}}>&#8635;</span>
                  {lang==='es'?'Generando...':'Generating...'}</>
              : <>{lang==='es'?'Exportar PDF':'Export PDF'}</>
            }
          </button>
        </div>
      </div>

      {/* PDF content */}
      <div style={{flex:1,overflowY:'auto',padding:'24px',background:'#050508'}}>
        <div id="pdf-layout" style={{
          maxWidth:920,margin:'0 auto',
          background:'#080810',borderRadius:16,overflow:'hidden',
          border:'1px solid #1A1A26',fontFamily:'Helvetica,Arial,sans-serif'}}>

          {/* ═══ HERO ═══ */}

            {/* Gold top line */}
            <div style={{position:'absolute',top:0,left:0,right:0,height:2,
              background:'linear-gradient(90deg,transparent,#F5A623 30%,#F5A623 70%,transparent)'}}/>
            <div style={{position:'relative',display:'flex',minHeight:260}}>
              {/* Left info */}
              <div style={{flex:1,padding:'28px 30px 24px'}}>
                {/* Top row: logos + report label */}
                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:18}}>

                    background:'rgba(245,166,35,.07)',border:'1px solid rgba(245,166,35,.18)',

                        color:'#F5A623'}}>
                        {report.playerName?.charAt(0)?.toUpperCase()||'?'}
                      </div>
                    </div>
                }
              </div>
            </div>
          </div>

          {/* ═══ BODY ═══ */}
          <div style={{padding:'28px 30px 40px'}}>

            {/* Performance Dashboard */}
            <div style={{marginBottom:28}}>
              <PdfSection label="PERFORMANCE DASHBOARD"/>
              <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
                {[
                  {label:lang==='es'?'FECHA EVALUACIÓN':'EVALUATION DATE',
                    value:fmtDate(report.evaluationDate,lang)||'—',
                    sub:lang==='es'?'Última evaluación':'Last evaluation',c:'#F5A623'},
                  {label:lang==='es'?'POSICIÓN':'POSITION',
                    value:report.position||'—',
                    sub:report.dominantFoot,c:'#818CF8'},
                  {label:lang==='es'?'NACIONALIDAD':'NATIONALITY',
                    value:report.nationality||'—',
                    sub:report.currentClub||'',c:'#14B8A6'},
                  {label:'STATUS',
                    value:STATUS_LABELS[lang][report.scoutingStatus]||report.scoutingStatus,
                    sub:'Scouting Status',c:STATUS_CFG[report.scoutingStatus]?.color||'#F5A623'},
                ].map(card=>(
                  <div key={card.label} style={{padding:'12px 14px',borderRadius:9,
                    background:'#0D0D18',border:`1px solid ${card.c}18`}}>
                    <div style={{fontSize:7,fontWeight:700,letterSpacing:'.18em',
                      color:card.c,marginBottom:6,textTransform:'uppercase',
                      fontFamily:'Helvetica,Arial,sans-serif'}}>{card.label}</div>
                    <div style={{fontFamily:'Helvetica,Arial,sans-serif',fontWeight:900,
                      fontSize:15,color:card.c,lineHeight:1.1,wordBreak:'break-word'}}>{card.value}</div>
                    {card.sub&&<div style={{fontSize:8.5,color:'#3E4658',marginTop:3,
                      fontFamily:'Helvetica,Arial,sans-serif'}}>{card.sub}</div>}
                  </div>
                ))}
              </div>
            </div>

            {/* Executive Summary */}
            {report.executiveSummary&&(
              <div style={{marginBottom:28}}>
                <PdfSection label="EXECUTIVE SUMMARY"/>
                <div style={{padding:'15px 18px',borderRadius:10,background:'#0D0D18',
                  border:'1px solid #1C1C28',borderLeft:'3px solid #F5A623'}}>
                  <p style={{fontSize:12,color:'#D1D5DB',lineHeight:1.8,margin:0,
                    fontFamily:'Helvetica,Arial,sans-serif'}}>{report.executiveSummary}</p>
                </div>
              </div>
            )}

            {/* Hexagon charts — 2x2 grid */}
            <div style={{marginBottom:28}}>
              <PdfSection label={lang==='es'?'ANÁLISIS POR CATEGORÍA':'CATEGORY ANALYSIS'}/>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                {ATTR_GROUPS.map(g=>(
                  <div key={g.id} style={{
                    padding:'18px 16px 16px',borderRadius:12,
                    background:'#0C0C18',border:`1px solid ${g.color}20`}}>
                    <div style={{fontSize:9,fontWeight:700,letterSpacing:'.18em',
                      textTransform:'uppercase',color:g.color,marginBottom:14,
                      fontFamily:'Helvetica,Arial,sans-serif'}}>
                      {g.label[lang]}
                    </div>
                    <div style={{display:'flex',justifyContent:'center'}}>
                      <HexChart
                        attrs={g.attrs}
                        values={report.attributes}
                        color={g.color}
                        size={210}/>
                    </div>
                    {/* Score list below chart */}
                    <div style={{marginTop:12,display:'flex',flexDirection:'column',gap:5}}>
                      {g.attrs.map(({key,label})=>{
                        const v=report.attributes[key]||0;
                        const pct=(v/10)*100;
                        return (
                          <div key={key} style={{display:'flex',alignItems:'center',gap:8}}>
                            <span style={{fontSize:9,width:90,textAlign:'right',flexShrink:0,
                              color:'#6B7280',fontFamily:'Helvetica,Arial,sans-serif'}}>
                              {label.replace('\n',' ')}
                            </span>
                            <div style={{flex:1,height:3.5,borderRadius:2,background:'#1A1A26'}}>
                              <div style={{height:'100%',borderRadius:2,
                                width:`${pct}%`,
                                background:`linear-gradient(90deg,${g.color}60,${g.color})`}}/>
                            </div>
                            <span style={{fontSize:9,fontWeight:700,width:22,flexShrink:0,
                              color:g.color,fontFamily:'Helvetica,Arial,sans-serif'}}>
                              {v.toFixed(1)}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Observations */}
            {(report.playerContext||report.technicalObs||report.tacticalObs||report.physicalObs)&&(
              <div style={{marginBottom:28}}>
                <PdfSection label={lang==='es'?'OBSERVACIONES':'OBSERVATIONS'}/>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                  {[
                    {k:'playerContext',l:lang==='es'?'Contexto del Jugador':'Player Context'},
                    {k:'technicalObs',l:lang==='es'?'Observaciones Técnicas':'Technical'},
                    {k:'tacticalObs',l:lang==='es'?'Observaciones Tácticas':'Tactical'},
                    {k:'physicalObs',l:lang==='es'?'Observaciones Físicas':'Physical'},
                    {k:'mentality',l:lang==='es'?'Mentalidad':'Mentality'},
                  ].map(({k,l})=>report[k]&&(
                    <TxtBlock key={k} title={l} text={report[k]}/>
                  ))}
                </div>
              </div>
            )}

            {/* Role Fit + Conclusion */}
            {(report.roleFit||report.conclusion)&&(
              <div style={{marginBottom:28}}>
                <PdfSection label={lang==='es'?'ROLE FIT & CONCLUSIÓN':'ROLE FIT & CONCLUSION'}/>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                  {report.roleFit&&<TxtBlock title="ROLE FIT" text={report.roleFit}/>}
                  {report.conclusion&&<TxtBlock title={lang==='es'?'CONCLUSIÓN':'CONCLUSION'} text={report.conclusion}/>}
                </div>
              </div>
            )}

            {/* Recommendation */}
            {report.recommendation&&(
              <div style={{marginBottom:28}}>
                <PdfSection label={lang==='es'?'RECOMENDACIÓN FINAL':'FINAL RECOMMENDATION'}/>
                <div style={{padding:'16px 20px',borderRadius:12,
                  background:'linear-gradient(135deg,rgba(245,166,35,.06),rgba(245,166,35,.02))',
                  border:'1px solid rgba(245,166,35,.18)'}}>
                  <p style={{fontSize:12,color:'#E5E7EB',lineHeight:1.8,margin:0,
                    fontFamily:'Helvetica,Arial,sans-serif'}}>{report.recommendation}</p>
                </div>
              </div>
            )}

            {/* Teams */}
            {report.suggestedTeams?.length>0&&(
              <div style={{marginBottom:28}}>
                <PdfSection label={lang==='es'?'POSIBLES EQUIPOS EN ESPAÑA':'POSSIBLE TEAMS IN SPAIN'}/>
                <div style={{borderRadius:12,overflow:'hidden',border:'1px solid #1A1A24'}}>
                  <div style={{display:'grid',gridTemplateColumns:'2fr 1.5fr 1fr 2fr',
                    padding:'9px 16px',background:'#0D0D18',borderBottom:'1px solid #1A1A24'}}>
                    {[lang==='es'?'CLUB':'CLUB',lang==='es'?'CATEGORÍA':'CATEGORY',
                      lang==='es'?'NIVEL':'LEVEL',lang==='es'?'OBSERVACIONES':'OBSERVATIONS'].map(h=>(
                      <div key={h} style={{fontSize:7,fontWeight:700,letterSpacing:'.18em',
                        color:'#F5A623',textTransform:'uppercase',
                        fontFamily:'Helvetica,Arial,sans-serif'}}>{h}</div>
                    ))}
                  </div>
                  {report.suggestedTeams.map((tm,i)=>(
                    <div key={i} style={{display:'grid',gridTemplateColumns:'2fr 1.5fr 1fr 2fr',
                      padding:'9px 16px',background:i%2===0?'#0A0A14':'#0C0C18',
                      borderBottom:i<report.suggestedTeams.length-1?'1px solid #141420':'none'}}>
                      <div style={{fontSize:11,color:'#E5E7EB',fontWeight:600,
                        fontFamily:'Helvetica,Arial,sans-serif'}}>{tm.club||'—'}</div>
                      <div style={{fontSize:11,color:'#9CA3AF',fontFamily:'Helvetica,Arial,sans-serif'}}>{tm.category||'—'}</div>
                      <div style={{fontSize:11,color:'#14B8A6',fontWeight:700,fontFamily:'Helvetica,Arial,sans-serif'}}>{tm.estimatedLevel||'—'}</div>
                      <div style={{fontSize:10,color:'#6B7280',fontFamily:'Helvetica,Arial,sans-serif'}}>{tm.observations||'—'}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Footer */}
            <div style={{marginTop:32,paddingTop:18,borderTop:'1px solid #181826',
              display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <SielloLogo h={26}/>
              <div style={{fontSize:8,color:'#2E3040',textAlign:'right',
                fontFamily:'Helvetica,Arial,sans-serif'}}>
                <div>Confidential — Performance Report</div>
                <div>{new Date().getFullYear()} · Siello Football Group</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────
function App(){
  const [lang,setLang]=useState('es');
  const [view,setView]=useState('dashboard');
  const [reports,setReports]=useState(()=>loadReports());
  const [currentId,setCurrentId]=useState(null);

  const current=reports.find(r=>r.id===currentId)||null;

  function upsert(updated){
    const next=reports.map(r=>r.id===updated.id?updated:r);
    setReports(next);
    saveReports(next);
  }

  function handleNew(){
    const r=newReport();
    const next=[r,...reports];
    setReports(next);
    saveReports(next);
    setCurrentId(r.id);
    setView('form');
  }

  function handleOpen(id){setCurrentId(id);setView('form')}

  function handleDelete(id){
    const next=reports.filter(r=>r.id!==id);
    setReports(next);
    saveReports(next);
    if(currentId===id){setCurrentId(null);setView('dashboard')}
  }

  function handleSidebarNav(k){
    if(k==='new') handleNew();
    else setView('dashboard');
  }

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <Sidebar view={view} onNav={handleSidebarNav} lang={lang} setLang={setLang}/>
      <main style={{flex:1,marginLeft:58,height:'100%',overflow:'hidden',
        display:'flex',flexDirection:'column'}}>

        {view==='dashboard'&&(
          <div style={{flex:1,overflowY:'auto'}}>
            <Dashboard reports={reports} lang={lang}
              onNew={handleNew} onOpen={handleOpen} onDelete={handleDelete}/>
          </div>
        )}

        {(view==='form'||view==='preview')&&current&&(
          <>
            {/* Sub-topbar */}
            <div style={{display:'flex',alignItems:'center',gap:10,
              padding:'10px 18px',borderBottom:'1px solid var(--border)',
              background:'var(--surface)',flexShrink:0}}>
              <button className="btn-ghost" style={{padding:'6px 12px',fontSize:12}}
                onClick={()=>setView('dashboard')}>
                &larr; Dashboard
              </button>
              <div style={{width:1,height:18,background:'var(--border)'}}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:700,
                  overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {current.playerName||(lang==='es'?'Nuevo Reporte':'New Report')}
                </div>
                {current.position&&<div style={{fontSize:11,color:'var(--muted)'}}>{current.position}</div>}
              </div>
              {/* Mode toggle */}
              <div style={{display:'flex',gap:1,padding:2,borderRadius:7,
                background:'var(--surface2)',border:'1px solid var(--border)'}}>
                {[
                  {k:'form',   l:lang==='es'?'Editar':'Edit'},
                  {k:'preview',l:lang==='es'?'Preview':'Preview'},
                ].map(m=>(
                  <button key={m.k} onClick={()=>setView(m.k)}
                    style={{padding:'5px 12px',borderRadius:5,border:'none',cursor:'pointer',
                      fontSize:12,fontWeight:600,fontFamily:'var(--font)',transition:'all .15s',
                      background:view===m.k?'var(--surface3)':'transparent',
                      color:view===m.k?'var(--text)':'var(--muted)'}}>
                    {m.l}
                  </button>
                ))}
              </div>
            </div>

            <div style={{flex:1,overflow:'hidden'}}>
              {view==='form'
                ? <ReportForm report={current} onUpdate={upsert}
                    onPreview={()=>setView('preview')}
                    onBack={()=>setView('dashboard')}
                    lang={lang}/>
                : <ReportPreview report={current} lang={lang} onEdit={()=>setView('form')}/>
              }
            </div>
          </>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
