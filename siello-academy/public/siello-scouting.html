<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Siello Academy — Performance Reports</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#F5A623;--gold-dark:#D4880A;
  --bg:#080808;--surface:#111114;--surface2:#18181C;--surface3:#222228;
  --border:#2A2A32;--borderl:#3A3A44;
  --teal:#14B8A6;--indigo:#818CF8;--red:#F87171;
  --text:#F4F4F5;--muted:#71717A;--dim:#3F3F46;
  --font:Helvetica,Arial,sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;height:100%}
#root{height:100%}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--borderl);border-radius:2px}
input,select,textarea{font-family:var(--font);font-size:13px;color:var(--text)}
textarea{resize:none}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;width:100%}
input[type=range]::-webkit-slider-track{background:var(--surface3);height:4px;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;background:var(--gold);height:16px;width:16px;border-radius:50%;margin-top:-6px;box-shadow:0 0 8px rgba(245,166,35,.4)}
input[type=range]:focus{outline:none}
.grid-bg{background-image:linear-gradient(rgba(245,166,35,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(245,166,35,.015) 1px,transparent 1px);background-size:32px 32px}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#000;border:none;cursor:pointer;font-family:var(--font);font-weight:700;border-radius:8px;transition:opacity .15s,transform .1s}
.btn-gold:hover{opacity:.88}
.btn-gold:active{transform:scale(.97)}
.btn-ghost{background:var(--surface2);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-family:var(--font);border-radius:8px;transition:all .15s}
.btn-ghost:hover{border-color:var(--borderl);color:var(--text)}
.input-field{background:var(--surface3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;width:100%;font-family:var(--font)}
.input-field:focus{border-color:rgba(245,166,35,.5);outline:none;box-shadow:0 0 0 2px rgba(245,166,35,.08)}
.card{background:var(--surface2);border:1px solid var(--border);border-radius:12px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>

// ─── DATE FORMAT ──────────────────────────────────────────────────
function fmtDateNum(iso){
  if(!iso) return '';
  try{
    const d=new Date(iso+'T00:00:00');
    const day=String(d.getDate()).padStart(2,'0');
    const mon=String(d.getMonth()+1).padStart(2,'0');
    return `${day}/${mon}/${d.getFullYear()}`;
  }catch{return iso}
}
function calcAge(dob){
  if(!dob) return null;
  const b=new Date(dob), now=new Date();
  let a=now.getFullYear()-b.getFullYear();
  if(now.getMonth()<b.getMonth()||(now.getMonth()===b.getMonth()&&now.getDate()<b.getDate())) a--;
  return a;
}

// ─── HEXAGON CHART (black/white/gold) ─────────────────────────────
function HexChart({attrs,values,color,size=200}){
  const n=attrs.length, cx=size/2, cy=size/2, R=size*0.31, Rl=size*0.47;
  function pt(i,frac=1){
    const a=(i*2*Math.PI/n)-Math.PI/2;
    return{x:cx+frac*R*Math.cos(a),y:cy+frac*R*Math.sin(a),a};
  }
  const grid=[2,4,6,8,10];
  const scorePoly=attrs.map(({key},i)=>pt(i,(values[key]||0)/10));
  const scoreStr=scorePoly.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  return(
    <svg width={size} height={size} style={{overflow:'visible'}}>
      {grid.map(lv=>(
        <polygon key={lv}
          points={attrs.map((_,i)=>{const p=pt(i,lv/10);return`${p.x.toFixed(1)},${p.y.toFixed(1)}`}).join(' ')}
          fill="none" stroke="rgba(255,255,255,0.14)" strokeWidth={lv===10?1.5:1}/>
      ))}
      {attrs.map((_,i)=>{
        const p=pt(i);
        return<line key={i} x1={cx.toFixed(1)} y1={cy.toFixed(1)}
          x2={p.x.toFixed(1)} y2={p.y.toFixed(1)} stroke="rgba(255,255,255,0.1)" strokeWidth="1"/>;
      })}
      <polygon points={scoreStr} fill={color==='#F5A623'?'rgba(245,166,35,0.18)':'rgba(20,184,166,0.18)'}
        stroke={color} strokeWidth="2"/>
      {scorePoly.map((p,i)=>(
        <circle key={i} cx={p.x.toFixed(1)} cy={p.y.toFixed(1)} r="4"
          fill={color} stroke="rgba(255,255,255,0.3)" strokeWidth="1.5"/>
      ))}
      {attrs.map(({key,label},i)=>{
        const{x,y,a}=pt(i,1);
        const lx=cx+(Rl)*Math.cos(a), ly=cy+(Rl)*Math.sin(a);
        const cos=Math.cos(a),sin=Math.sin(a);
        const anchor=cos>0.25?'start':cos<-0.25?'end':'middle';
        const parts=label.split('\n');
        const lh=9;
        const yOff=sin<-0.2?-(parts.length*lh):sin>0.2?0:-(parts.length*lh/2);
        return(
          <text key={i} textAnchor={anchor}
            fontFamily="Helvetica,Arial,sans-serif" fontSize="7.5" fontWeight="700"
            fill="rgba(255,255,255,0.65)" letterSpacing=".03em">
            {parts.map((part,j)=>(
              <tspan key={j} x={lx.toFixed(1)} y={(ly+yOff+j*lh).toFixed(1)}>{part}</tspan>
            ))}
          </text>
        );
      })}
    </svg>
  );
}

// ─── PHOTO UPLOAD ─────────────────────────────────────────────────
function PhotoUpload({value,onChange,label}){
  const ref=useRef();
  function handleFile(e){
    const f=e.target.files?.[0]; if(!f) return;
    const r=new FileReader(); r.onload=ev=>onChange(ev.target.result); r.readAsDataURL(f);
  }
  return(
    <div onClick={()=>ref.current?.click()}
      style={{position:'relative',width:'100%',aspectRatio:'4/3',borderRadius:10,
        background:'var(--surface3)',border:'2px dashed var(--border)',
        display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
        cursor:'pointer',overflow:'hidden'}}
      onMouseEnter={e=>e.currentTarget.style.borderColor='rgba(245,166,35,.5)'}
      onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
      <input ref={ref} type="file" accept="image/*" style={{display:'none'}} onChange={handleFile}/>
      {value
        ? <img src={value} style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover'}}/>
        : <div style={{textAlign:'center',padding:12}}>
            <div style={{fontSize:20,opacity:.3,marginBottom:6}}>[ ]</div>
            <div style={{fontSize:11,color:'var(--muted)'}}>{label}</div>
          </div>
      }
    </div>
  );
}
function Lbl({text}){
  return<label style={{display:'block',fontSize:10,fontWeight:600,color:'var(--muted)',
    letterSpacing:'.06em',textTransform:'uppercase',marginBottom:6}}>{text}</label>;
}

// ─── REPORT FORM ──────────────────────────────────────────────────
function ReportForm({report,onUpdate,onPreview,onBack,lang}){
  const [step,setStep]=useState(0);
  const [saved,setSaved]=useState(false);
  function handleChange(updates){
    onUpdate({...report,...updates,updatedAt:new Date().toISOString()});
  }
  function handleSave(){setSaved(true);setTimeout(()=>setSaved(false),2200)}
  function handleNext(){handleSave();if(step<3)setStep(s=>s+1)}
  const STEPS={
    es:['Datos','Evaluación','Textos','Equipos'],
    en:['Player','Evaluation','Text','Teams'],
  }[lang];
  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      {/* Steps */}
      <div style={{padding:'16px 20px 13px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:3}}>
          {STEPS.map((s,i)=>(
            <React.Fragment key={i}>
              <button onClick={()=>setStep(i)}
                style={{display:'flex',alignItems:'center',gap:5,background:'none',
                  border:'none',cursor:'pointer',padding:'2px 3px'}}>
                <div style={{width:19,height:19,borderRadius:'50%',
                  display:'flex',alignItems:'center',justifyContent:'center',
                  fontSize:9,fontWeight:700,fontFamily:'var(--font)',flexShrink:0,
                  background:i===step?'var(--gold)':i<step?'rgba(245,166,35,.25)':'var(--surface3)',
                  color:i===step?'#000':i<step?'var(--gold)':'var(--muted)'}}>
                  {i<step?'✓':i+1}
                </div>
                <span style={{fontSize:11,fontWeight:600,whiteSpace:'nowrap',
                  color:i===step?'var(--text)':'var(--muted)'}}>{s}</span>
              </button>
              {i<3&&<div style={{flex:1,height:1,minWidth:6,
                background:i<step?'var(--gold)':'var(--border)'}}/>}
            </React.Fragment>
          ))}
        </div>
      </div>
      {/* Content */}
      <div style={{flex:1,overflowY:'auto',padding:'20px'}}>
        {step===0&&<Step1 report={report} onChange={handleChange} lang={lang}/>}
        {step===1&&<Step2 report={report} onChange={handleChange} lang={lang}/>}
        {step===2&&<Step3 report={report} onChange={handleChange} lang={lang}/>}
        {step===3&&<Step4 report={report} onChange={handleChange} lang={lang}/>}
      </div>
      {/* Footer */}
      <div style={{padding:'12px 20px',borderTop:'1px solid var(--border)',
        background:'var(--surface)',display:'flex',alignItems:'center',
        justifyContent:'space-between',gap:8,flexShrink:0}}>
        <button className="btn-ghost" style={{padding:'7px 13px',fontSize:12}}
          onClick={step===0?onBack:()=>setStep(s=>s-1)}>
          {step===0?'Dashboard':'← '+(lang==='es'?'Atrás':'Back')}
        </button>
        <div style={{display:'flex',gap:7}}>
          <button className="btn-ghost"
            style={{padding:'7px 13px',fontSize:12,
              color:saved?'var(--teal)':'var(--muted)',
              borderColor:saved?'rgba(20,184,166,.3)':'var(--border)'}}
            onClick={handleSave}>
            {saved?(lang==='es'?'Guardado':'Saved'):(lang==='es'?'Guardar':'Save')}
          </button>
          <button className="btn-ghost"
            style={{padding:'7px 13px',fontSize:12,color:'var(--gold)',
              borderColor:'rgba(245,166,35,.2)'}}
            onClick={onPreview}>
            {lang==='es'?'Vista Previa':'Preview'}
          </button>
          {step<3
            ? <button className="btn-gold" style={{padding:'7px 14px',fontSize:12}}
                onClick={handleNext}>
                {lang==='es'?'Siguiente':'Next'} →
              </button>
            : <button className="btn-gold" style={{padding:'7px 14px',fontSize:12}}
                onClick={onPreview}>
                {lang==='es'?'Ver Reporte':'View Report'}
              </button>
          }
        </div>
      </div>
    </div>
  );
}

// ─── PDF DIVIDER ──────────────────────────────────────────────────
function PdfDiv({label}){
  return(
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:15}}>
      <div style={{width:3,height:14,borderRadius:2,flexShrink:0,
        background:'linear-gradient(180deg,#F5A623 0%,#D4880A 100%)'}}/>
      <span style={{fontSize:7.5,fontWeight:900,letterSpacing:'.28em',textTransform:'uppercase',
        color:'#F5A623',whiteSpace:'nowrap',fontFamily:'Helvetica,Arial,sans-serif'}}>{label}</span>
      <div style={{flex:1,height:1,
        background:'linear-gradient(90deg,rgba(245,166,35,.3) 0%,rgba(42,42,50,0) 100%)'}}/>
    </div>
  );
}

// ─── REPORT PREVIEW ───────────────────────────────────────────────
function ReportPreview({report,lang,onEdit}){
  const [exporting,setExporting]=useState(false);
  const age=calcAge(report.dateOfBirth);
  const flagCode=getFlagCode(report.nationality);

  async function handleExport(){
    setExporting(true);
    try{
      const el=document.getElementById('pdf-layout');

      // Wait for every <img> in the layout to be fully decoded
      await Promise.all(Array.from(el.querySelectorAll('img')).map(img=>
        img.complete && img.naturalWidth>0
          ? Promise.resolve()
          : new Promise(res=>{ img.onload=res; img.onerror=res; })
      ));
      // Give layout a frame to settle after image loads
      await new Promise(res=>setTimeout(res,250));

      const canvas=await html2canvas(el,{
        scale:2,
        useCORS:true,
        allowTaint:true,
        backgroundColor:'#080808',
        logging:false,
        width:el.scrollWidth,
        height:el.scrollHeight,
        // Use actual viewport so CSS resolves correctly
        windowWidth:window.innerWidth,
        windowHeight:window.innerHeight,
        imageTimeout:20000,
        onclone:(clonedDoc,clonedEl)=>{
          // FIX A: objectFit:cover — html2canvas doesn't support it; image renders
          // uncropped/stretched. Replace cover <img> with a background-image div.
          Array.from(clonedEl.querySelectorAll('img')).forEach(img=>{
            if(img.style.objectFit==='cover'){
              const div=clonedDoc.createElement('div');
              div.style.position=img.style.position||'absolute';
              div.style.top='0'; div.style.left='0';
              div.style.right='0'; div.style.bottom='0';
              div.style.width=img.style.width||'100%';
              div.style.height=img.style.height||'100%';
              div.style.backgroundImage=`url("${img.src}")`;
              div.style.backgroundSize='cover';
              div.style.backgroundPosition=img.style.objectPosition||'top center';
              div.style.backgroundRepeat='no-repeat';
              img.parentNode.replaceChild(div,img);
            }
          });
          // FIX B: CSS filter on <img> — html2canvas support inconsistent.
          // Pre-draw filtered image onto a <canvas> in the clone.
          Array.from(clonedEl.querySelectorAll('img')).forEach(img=>{
            if(!img.style.filter) return;
            const c=clonedDoc.createElement('canvas');
            const iw=img.naturalWidth||200, ih=img.naturalHeight||60;
            c.width=iw; c.height=ih;
            c.style.height=img.style.height;
            c.style.objectFit=img.style.objectFit||'contain';
            c.style.verticalAlign='middle';
            const ctx=c.getContext('2d');
            ctx.filter=img.style.filter;
            ctx.drawImage(img,0,0,iw,ih);
            img.parentNode.replaceChild(c,img);
          });
          // Wait for any remaining <img> in the clone to finish loading
          return Promise.all(Array.from(clonedEl.querySelectorAll('img')).map(img=>
            img.complete && img.naturalWidth>0
              ? Promise.resolve()
              : new Promise(res=>{ img.onload=res; img.onerror=res; })
          ));
        },
      });
      const {jsPDF}=window.jspdf;
      const w=canvas.width/2, h=canvas.height/2;
      const pdf=new jsPDF({orientation:'portrait',unit:'px',format:[w,h],compress:true});
      pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',0,0,w,h);
      const name=(report.playerName||'report').replace(/\s+/g,'_');
      pdf.save(`Siello_${name}_Performance_Report.pdf`);
    }finally{setExporting(false)}
  }

  // ── PDF color tokens ──
  const P={
    bg:'#080808',
    surface:'#111114',
    border:'#2A2A32',
    text:'#F0F0F2',
    muted:'#71717A',
    faint:'#52525B',
    gold:'#F5A623',
    goldBg:'rgba(245,166,35,.08)',
    black:'#F0F0F2',
    line:'#2A2A32',
  };

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      {/* Top bar */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
        padding:'13px 20px',borderBottom:'1px solid var(--border)',
        background:'var(--surface)',flexShrink:0}}>
        <div>
          <h2 style={{fontSize:14,fontWeight:700}}>
            {lang==='es'?'Vista Previa':'Preview'}
          </h2>
          <p style={{fontSize:11,color:'var(--muted)',marginTop:1}}>
            {lang==='es'?'PDF listo para exportar':'PDF ready to export'}
          </p>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn-ghost" style={{padding:'7px 13px',fontSize:12}} onClick={onEdit}>
            {lang==='es'?'Editar':'Edit'}
          </button>
          <button className="btn-gold"
            style={{padding:'8px 18px',fontSize:12,display:'flex',alignItems:'center',gap:6,
              opacity:exporting?.7:1}}
            onClick={handleExport} disabled={exporting}>
            {exporting
              ? <><span style={{animation:'spin 1s linear infinite',display:'inline-block'}}>&#8635;</span>
                  {lang==='es'?'Generando...':'Generating...'}</>
              : lang==='es'?'Exportar PDF':'Export PDF'
            }
          </button>
        </div>
      </div>

      {/* PDF scroll area */}
      <div style={{flex:1,overflowY:'auto',padding:'24px',background:'#030303'}}>
        <div id="pdf-layout" style={{
          maxWidth:860,margin:'0 auto',background:P.bg,
          borderRadius:0,overflow:'hidden',position:'relative',
          boxShadow:'0 4px 32px rgba(0,0,0,.2)',
          fontFamily:'Helvetica,Arial,sans-serif'}}>
          {/* Gold left border line running full height */}
          <div style={{position:'absolute',left:0,top:0,bottom:0,width:4,zIndex:10,
            background:'linear-gradient(180deg,#F5A623 0%,#D4880A 60%,rgba(212,136,10,0.3) 100%)',
            pointerEvents:'none'}}/>

          {/* ═══ HERO (dark) ═══ */}
          <div style={{position:'relative',overflow:'hidden',background:'#0A0A0E'}}>
            {/* Gold stripe top */}
            <div style={{position:'absolute',top:0,left:0,right:0,height:4,
              background:'linear-gradient(90deg,#F5A623 0%,#FFD77A 50%,#D4880A 100%)'}}/>
            <div style={{position:'relative',display:'flex',minHeight:280}}>
              {/* Left */}
              <div style={{flex:1,padding:'28px 30px 28px',display:'flex',flexDirection:'column',justifyContent:'center',gap:10}}>
                {/* Logo row */}
                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:4}}>
                  <img src={SIELLO_URL} style={{height:28,objectFit:'contain'}}/>
                  <div style={{width:1,height:18,background:'rgba(255,255,255,0.15)',flexShrink:0}}/>
                  <img src={NIKE_URL} style={{height:32,objectFit:'contain',filter:'brightness(0) invert(1)'}}/>
                </div>
                {/* PERFORMANCE REPORT label */}
                <div style={{fontSize:8,fontWeight:900,letterSpacing:'.32em',textTransform:'uppercase',
                  color:'#F5A623',fontFamily:'Helvetica,Arial,sans-serif'}}>
                  PERFORMANCE REPORT
                </div>
                {/* Player name */}
                <h1 style={{fontFamily:'Helvetica,Arial,sans-serif',fontSize:36,fontWeight:900,
                  color:'#FFFFFF',lineHeight:1.05,letterSpacing:'-.02em',margin:0}}>
                  {report.playerName||(lang==='es'?'Nombre del Jugador':'Player Name')}
                </h1>
                {/* Evaluation date */}
                {report.evaluationDate&&(
                  <div style={{fontSize:11,color:'rgba(255,255,255,0.4)',
                    fontFamily:'Helvetica,Arial,sans-serif',letterSpacing:'.04em'}}>
                    {lang==='es'?'EVALUACIÓN':'EVALUATION'} — {fmtDateNum(report.evaluationDate)}
                  </div>
                )}
              </div>
              {/* Photo — wider, with left-edge gradient blend */}
              <div style={{width:260,flexShrink:0,position:'relative',background:'#0D0D18'}}>
                {report.playerPhoto
                  ? <>
                      <img src={report.playerPhoto}
                        style={{position:'absolute',inset:0,width:'100%',height:'100%',
                          objectFit:'cover',objectPosition:'top center'}}/>
                      {/* Left blend + bottom fade */}
                      <div style={{position:'absolute',inset:0,pointerEvents:'none',
                        background:'linear-gradient(to right,rgba(10,10,14,0.92) 0%,rgba(10,10,14,0.4) 30%,rgba(10,10,14,0) 60%)'}}/>
                      <div style={{position:'absolute',inset:0,pointerEvents:'none',
                        background:'linear-gradient(to bottom,rgba(10,10,14,0) 50%,rgba(10,10,14,0.7) 100%)'}}/>
                    </>
                  : <div style={{width:'100%',height:'100%',minHeight:280,
                      display:'flex',alignItems:'center',justifyContent:'center',
                      background:'linear-gradient(135deg,#0D0D18,#151530)'}}>
                      <div style={{width:72,height:72,borderRadius:'50%',
                        background:'rgba(245,166,35,.08)',border:'2px solid rgba(245,166,35,.2)',
                        display:'flex',alignItems:'center',justifyContent:'center',
                        fontFamily:'Helvetica,Arial,sans-serif',fontWeight:900,
                        fontSize:28,color:'#F5A623'}}>
                        {report.playerName?.charAt(0)?.toUpperCase()||'?'}
                      </div>
                    </div>
                }
              </div>
            </div>
          </div>

          {/* ═══ BODY (dark) ═══ */}
          <div style={{padding:'26px 28px 36px',background:P.bg}}>

            {/* Player Information */}
            <div style={{marginBottom:24}}>
              <PdfDiv label={lang==='es'?'INFORMACIÓN DEL JUGADOR':'PLAYER INFORMATION'}/>
              <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8}}>
                {[
                  {label:lang==='es'?'FECHA DE NACIMIENTO':'DATE OF BIRTH',
                    value:fmtDateNum(report.dateOfBirth)||'—',
                    c:P.gold},
                  {label:lang==='es'?'POSICIÓN':'POSITION',
                    value:report.position||'—',
                    c:P.muted},
                  {label:lang==='es'?'NACIONALIDAD':'NATIONALITY',
                    value:report.nationality||'—',
                    flagCode:getFlagCode(report.nationality),
                    c:P.muted},
                  {label:lang==='es'?'PIE HÁBIL':'DOMINANT FOOT',
                    value:report.dominantFoot||'—',
                    c:P.muted},
                ].map(card=>(
                  <div key={card.label} style={{padding:'11px 13px',borderRadius:7,
                    background:P.surface,border:`1px solid ${P.border}`,
                    borderTop:`2px solid ${card.c}`}}>
                    <div style={{fontSize:7,fontWeight:700,letterSpacing:'.18em',
                      color:card.c,marginBottom:5,textTransform:'uppercase',
                      fontFamily:'Helvetica,Arial,sans-serif'}}>{card.label}</div>
                    <div style={{fontFamily:'Helvetica,Arial,sans-serif',fontWeight:900,
                      fontSize:14,color:P.text,lineHeight:1.1,wordBreak:'break-word',
                      display:'flex',alignItems:'center',gap:5}}>
                      {card.flagCode&&<FlagImg nat={card.value} h={11}/>}
                      {card.value}
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Executive Summary */}
            {report.executiveSummary&&(
              <div style={{marginBottom:24}}>
                <PdfDiv label="EXECUTIVE SUMMARY"/>
                <div style={{padding:'14px 16px',borderRadius:8,background:P.surface,
                  border:`1px solid ${P.border}`,borderLeft:`3px solid ${P.gold}`}}>
                  <p style={{fontSize:12,color:P.text,lineHeight:1.8,margin:0,
                    fontFamily:'Helvetica,Arial,sans-serif'}}>{report.executiveSummary}</p>
                </div>
              </div>
            )}

            {/* 4 Hexagon charts */}
            <div style={{marginBottom:24}}>
              <PdfDiv label={lang==='es'?'ANÁLISIS POR CATEGORÍA':'CATEGORY ANALYSIS'}/>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
                {ATTR_GROUPS.map(g=>(
                  <div key={g.id} style={{padding:'16px 14px 14px',borderRadius:9,
                    background:P.surface,border:`1px solid ${P.border}`}}>
                    {/* Title bar */}
                    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:12}}>
                      <div style={{width:3,height:14,borderRadius:1,background:P.gold}}/>
                      <span style={{fontSize:8.5,fontWeight:900,letterSpacing:'.18em',
                        textTransform:'uppercase',color:P.text,
                        fontFamily:'Helvetica,Arial,sans-serif'}}>{g.label[lang]}</span>
                    </div>
                    {/* Chart */}
                    <div style={{display:'flex',justifyContent:'center',marginBottom:12}}>
                      <HexChart attrs={g.attrs} values={report.attributes}
                        color={g.color} size={190}/>
                    </div>
                    {/* Score bars */}
                    <div style={{display:'flex',flexDirection:'column',gap:5}}>
                      {g.attrs.map(({key,label})=>{
                        const v=report.attributes[key]||0;
                        const pct=(v/10)*100;
                        return(
                          <div key={key} style={{display:'flex',alignItems:'center',gap:7}}>
                            <span style={{fontSize:8.5,width:88,textAlign:'right',
                              flexShrink:0,color:P.muted,fontFamily:'Helvetica,Arial,sans-serif',
                              fontWeight:600,lineHeight:1.2}}>
                              {label.replace('\n',' ')}
                            </span>
                            <div style={{flex:1,height:4,borderRadius:2,background:P.line}}>
                              <div style={{height:'100%',borderRadius:2,width:`${pct}%`,
                                background:'linear-gradient(90deg,#D4880A,#F5A623)'}}/>
                            </div>
                            <span style={{fontSize:9,fontWeight:900,width:22,flexShrink:0,
                              textAlign:'right',color:P.text,
                              fontFamily:'Helvetica,Arial,sans-serif'}}>
                              {v.toFixed(1)}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Teams */}
            {report.suggestedTeams?.length>0&&(
              <div style={{marginBottom:24}}>
                <PdfDiv label={lang==='es'?'POSIBLES EQUIPOS EN ESPAÑA':'POSSIBLE TEAMS IN SPAIN'}/>
                <div style={{borderRadius:8,overflow:'hidden',
                  border:`1px solid ${P.border}`}}>
                  <div style={{display:'grid',gridTemplateColumns:'2fr 1.5fr 1fr 2fr',
                    padding:'8px 14px',background:P.surface,
                    borderBottom:`1px solid ${P.border}`}}>
                    {[lang==='es'?'CLUB':'CLUB',lang==='es'?'CATEGORÍA':'CATEGORY',
                      lang==='es'?'NIVEL':'LEVEL',lang==='es'?'OBSERVACIONES':'OBSERVATIONS'].map(h=>(
                      <div key={h} style={{fontSize:7,fontWeight:700,letterSpacing:'.18em',
                        color:P.faint,textTransform:'uppercase',
                        fontFamily:'Helvetica,Arial,sans-serif'}}>{h}</div>
                    ))}
                  </div>
                  {report.suggestedTeams.map((tm,i)=>(
                    <div key={i} style={{display:'grid',gridTemplateColumns:'2fr 1.5fr 1fr 2fr',
                      padding:'9px 14px',
                      background:i%2===0?P.bg:P.surface,
                      borderBottom:i<report.suggestedTeams.length-1?`1px solid ${P.border}`:'none'}}>
                      <div style={{fontSize:11,color:P.text,fontWeight:700,
                        fontFamily:'Helvetica,Arial,sans-serif'}}>{tm.club||'—'}</div>
                      <div style={{fontSize:11,color:P.muted,fontFamily:'Helvetica,Arial,sans-serif'}}>{tm.category||'—'}</div>
                      <div style={{fontSize:11,color:P.gold,fontWeight:700,fontFamily:'Helvetica,Arial,sans-serif'}}>{tm.estimatedLevel||'—'}</div>
                      <div style={{fontSize:10,color:P.faint,fontFamily:'Helvetica,Arial,sans-serif'}}>{tm.observations||'—'}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Conclusión / Notas */}
            {report.conclusionNotas&&(
              <div style={{marginBottom:8}}>
                <PdfDiv label={lang==='es'?'CONCLUSIÓN / NOTAS':'CONCLUSION / NOTES'}/>
                <div style={{padding:'14px 16px',borderRadius:8,
                  background:P.goldBg,border:`1px solid rgba(245,166,35,.25)`,
                  borderLeft:`3px solid ${P.gold}`}}>
                  <p style={{fontSize:12,color:P.text,lineHeight:1.8,margin:0,
                    fontFamily:'Helvetica,Arial,sans-serif'}}>{report.conclusionNotas}</p>
                </div>
              </div>
            )}

            {/* Footer */}
            <div style={{marginTop:28,paddingTop:16,
              borderTop:`1px solid ${P.border}`,
              display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <img src={SIELLO_URL} style={{height:22,objectFit:'contain'}}/>
                <img src={NIKE_URL} style={{height:18,objectFit:'contain',filter:'brightness(0) invert(1)'}}/>
              </div>
              <div style={{fontSize:8,color:P.line,textAlign:'right',
                fontFamily:'Helvetica,Arial,sans-serif',letterSpacing:'.06em'}}>
                <div>CONFIDENTIAL — PERFORMANCE REPORT</div>
                <div>{new Date().getFullYear()}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────
function App(){
  const [lang,setLang]=useState('es');
  const [view,setView]=useState('dashboard');
  const [reports,setReports]=useState(()=>loadReports());
  const [currentId,setCurrentId]=useState(null);

  const current=reports.find(r=>r.id===currentId)||null;

  function upsert(updated){
    const next=reports.map(r=>r.id===updated.id?updated:r);
    setReports(next);
    saveReports(next);
  }
  function handleNew(){
    const r=newReport(); const next=[r,...reports];
    setReports(next); saveReports(next);
    setCurrentId(r.id); setView('form');
  }
  function handleOpen(id){setCurrentId(id);setView('form')}
  function handleDelete(id){
    const next=reports.filter(r=>r.id!==id);
    setReports(next); saveReports(next);
    if(currentId===id){setCurrentId(null);setView('dashboard')}
  }
  function handleNav(k){if(k==='new') handleNew(); else setView('dashboard')}

  return(
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <Sidebar view={view} onNav={handleNav} lang={lang} setLang={setLang}/>
      <main style={{flex:1,marginLeft:58,height:'100%',overflow:'hidden',
        display:'flex',flexDirection:'column'}}>

        {view==='dashboard'&&(
          <div style={{flex:1,overflowY:'auto'}}>
            <Dashboard reports={reports} lang={lang}
              onNew={handleNew} onOpen={handleOpen} onDelete={handleDelete}/>
          </div>
        )}

        {(view==='form'||view==='preview')&&current&&(
          <>
            <div style={{display:'flex',alignItems:'center',gap:10,
              padding:'9px 17px',borderBottom:'1px solid var(--border)',
              background:'var(--surface)',flexShrink:0}}>
              <button className="btn-ghost" style={{padding:'5px 11px',fontSize:11}}
                onClick={()=>setView('dashboard')}>
                &larr; Dashboard
              </button>
              <div style={{width:1,height:16,background:'var(--border)'}}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:700,
                  overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {current.playerName||(lang==='es'?'Nuevo Reporte':'New Report')}
                </div>
                {current.position&&(
                  <div style={{fontSize:10,color:'var(--muted)'}}>{current.position}</div>
                )}
              </div>
              <div style={{display:'flex',gap:1,padding:2,borderRadius:6,
                background:'var(--surface2)',border:'1px solid var(--border)'}}>
                {[
                  {k:'form',l:lang==='es'?'Editar':'Edit'},
                  {k:'preview',l:'Preview'},
                ].map(m=>(
                  <button key={m.k} onClick={()=>setView(m.k)}
                    style={{padding:'5px 11px',borderRadius:4,border:'none',cursor:'pointer',
                      fontSize:11,fontWeight:600,fontFamily:'var(--font)',
                      background:view===m.k?'var(--surface3)':'transparent',
                      color:view===m.k?'var(--text)':'var(--muted)'}}>
                    {m.l}
                  </button>
                ))}
              </div>
            </div>
            <div style={{flex:1,overflow:'hidden'}}>
              {view==='form'
                ? <ReportForm report={current} onUpdate={upsert}
                    onPreview={()=>setView('preview')}
                    onBack={()=>setView('dashboard')}
                    lang={lang}/>
                : <ReportPreview report={current} lang={lang}
                    onEdit={()=>setView('form')}/>
              }
            </div>
          </>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
